<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Premodern Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ color-scheme: dark; --bg:#10161a; --panel:#1c2a2e; --ink:#eef6ee; --muted:#9db8a8; --gold:#fcd84a; --line:#2e4a44; --leaf:#5cae44; }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Press Start 2P", ui-monospace, "Courier New", monospace;padding-inline:16px;box-sizing:border-box}
  .wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:12px}
  h1{margin:0;font-size:clamp(12px,3.4vw,18px);color:var(--gold);text-shadow:3px 3px 0 #7a3a10;letter-spacing:.06em;text-align:center}
  .screen{width:min(100%, calc((100dvh - 170px) * 1.5)); max-width:960px; min-width:240px}
  canvas{display:block;width:100%;aspect-ratio:3/2;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:4px solid #000;box-shadow:0 0 0 4px var(--line),0 10px 0 4px #070b0d;box-sizing:border-box;touch-action:none}
  canvas:focus-visible{outline:3px solid var(--gold);outline-offset:6px}
  .keys{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;font-size:8px;color:var(--muted);line-height:1.8;max-width:700px}
  .keys span{white-space:nowrap}
  kbd{font-family:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;padding:2px 5px;border-radius:3px}
  .pad{display:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}
  .dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:2px}
  .pad button{font-family:inherit;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-bottom-width:6px;border-radius:10px;font-size:14px;touch-action:none;padding:0}
  .dpad button{width:54px;height:54px}
  .dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
  .acts{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .acts .row{display:flex;gap:12px;align-items:center}
  .acts .ab{width:64px;height:64px;border-radius:50%}
  .acts .a{background:#b8321a;border-color:#6a1a0a}
  .acts .b{background:#2a6a3a;border-color:#12401e}
  .acts .m{width:78px;height:34px;font-size:9px}
  .pad button:active,.pad button.on{transform:translateY(3px);border-bottom-width:3px}
  .net{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;font-size:8px;color:var(--muted);max-width:700px}
  .net button,.net input{font-family:inherit;font-size:9px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:6px;padding:8px 10px}
  .net button{cursor:pointer}
  .net button:focus-visible,.net input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .net input{width:92px;text-transform:uppercase;letter-spacing:.2em;text-align:center}
  .net #netStatus{flex-basis:100%;text-align:center;color:var(--gold);line-height:1.6}
  @media (pointer:coarse){ .pad{display:flex} .keys{display:none} .screen{width:min(100%, calc((100dvh - 250px) * 1.5))} }
</style>
</head>
<body>
<div class="wrap">
  <h1>PREMODERN QUEST</h1>
  <div class="screen"><canvas id="game" width="240" height="160" tabindex="0" aria-label="Juego de rol de acción con cartas"></canvas></div>
  <div class="keys">
    <span><kbd>Flechas</kbd>/<kbd>WASD</kbd> moverse</span>
    <span><kbd>Z</kbd>/<kbd>Espacio</kbd> atacar · aceptar</span>
    <span><kbd>X</kbd> hablar · volver</span>
    <span><kbd>Enter</kbd> menú</span>
    <span><kbd>M</kbd> sonido</span>
  </div>
  <div class="pad" id="pad">
    <div class="dpad">
      <button class="u" data-k="up" aria-label="Arriba">▲</button>
      <button class="l" data-k="left" aria-label="Izquierda">◀</button>
      <button class="r" data-k="right" aria-label="Derecha">▶</button>
      <button class="d" data-k="down" aria-label="Abajo">▼</button>
    </div>
    <div class="acts">
      <div class="row">
        <button class="ab b" data-k="b" aria-label="Hablar">B</button>
        <button class="ab a" data-k="a" aria-label="Atacar">A</button>
      </div>
      <button class="m" data-k="menu" aria-label="Menú">MENÚ</button>
    </div>
  </div>
  <div class="net" id="net">
    <span>ONLINE:</span>
    <button id="netHost" type="button">Crear sala</button>
    <input id="netCode" maxlength="4" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters" aria-label="Código de sala">
    <button id="netJoin" type="button">Unirse</button>
    <button id="netLeave" type="button">Salir</button>
    <span id="netStatus">Juega solo o crea una sala para jugar con amigos (hasta 3).</span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(() => {
'use strict';
const cvs = document.getElementById('game');
let ctx = cvs.getContext('2d');
const MAIN = ctx;
ctx.imageSmoothingEnabled = false;
const W = 240, H = 160, TS = 16;
let frame = 0;
const TOUCH = matchMedia('(pointer:coarse)').matches;

/* ============ INPUT ============ */
const K = {up:0,down:0,left:0,right:0,a:0,b:0,menu:0};
const prevK = {...K};
const kb = {}, touch = {};
const keyMap = {ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  KeyZ:'a',Space:'a',KeyJ:'a',KeyX:'b',KeyK:'b',Backspace:'b',Enter:'menu',Escape:'menu',KeyI:'menu'};
addEventListener('keydown', e => {
  audioInit();
  if (e.code === 'KeyM' && !e.repeat) toggleMute();
  const k = keyMap[e.code]; if (k) { kb[k] = 1; e.preventDefault(); }
});
addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) { kb[k] = 0; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in kb) kb[k] = 0; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); audioInit(); touch[k] = 1; b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch(_) {} };
  const off = e => { e.preventDefault(); touch[k] = 0; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
function readInput(){ Object.assign(prevK, K); for (const k in K) K[k] = (kb[k] || touch[k]) ? 1 : 0; }
const pressed = k => K[k] && !prevK[k];

/* ============ AUDIO ============ */
let AC = null, master = null, muted = false;
function audioInit(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.15; master.connect(AC.destination); } catch(_) { AC = null; }
}
function tone(f1, f2, dur, type='square', vol=0.5, delay=0){
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noteAt(f, t, dur, type, vol){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const seq = (arr, dt, type='square', vol=0.45) => arr.forEach((f, i) => tone(f, f, dt * 1.1, type, vol, i * dt));
const SFX = {
  swing: () => tone(520, 200, 0.08, 'triangle', 0.4),
  hit:   () => tone(320, 80, 0.08, 'square', 0.5),
  kill:  () => seq([420, 300, 190], 0.05),
  coin:  () => { tone(988, 988, 0.05, 'square', 0.35); tone(1319, 1319, 0.2, 'square', 0.35, 0.05); },
  card:  () => seq([659, 880, 1175, 1568], 0.07, 'square', 0.4),
  heart: () => seq([880, 1175], 0.06, 'triangle', 0.5),
  hurt:  () => tone(240, 90, 0.2, 'sawtooth', 0.4),
  talk:  () => tone(880, 880, 0.02, 'square', 0.12),
  move:  () => tone(660, 660, 0.03, 'square', 0.25),
  ok:    () => seq([660, 990], 0.05, 'square', 0.35),
  back:  () => seq([500, 330], 0.05, 'square', 0.3),
  lvl:   () => seq([523, 659, 784, 1047, 784, 1047, 1319], 0.08),
  door:  () => tone(200, 120, 0.15, 'triangle', 0.5),
  chest: () => seq([392, 494, 587, 784, 988], 0.07),
  beer:  () => seq([300, 250, 210, 260, 330], 0.07, 'triangle', 0.55),
  win:   () => seq([523, 659, 784, 1047, 1319], 0.1),
  lose:  () => seq([392, 330, 262, 196], 0.14),
  bush:  () => tone(900, 300, 0.06, 'sawtooth', 0.25),
  boss:  () => tone(90, 60, 0.4, 'sawtooth', 0.5),
  summon:() => tone(200, 420, 0.2, 'square', 0.4),
  heal:  () => seq([1047, 1319, 1568], 0.04, 'triangle', 0.3),
};
const NOTE = n => {
  if (n === '-') return 0;
  const m = /^([A-G])(#?)(\d)$/.exec(n);
  const idx = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]] + (m[2] ? 1 : 0);
  return 440 * Math.pow(2, (idx - 9) / 12 + (+m[3] - 4));
};
const parse = s => s.trim().split(/\s+/).map(t => { const [n, d] = t.split(':'); return [NOTE(n), +d]; });
const SONGS = {
  town: { bpm:120, lw:'square', lv:0.16,
    lead: parse('E5:2 G5:1 E5:1 D5:2 C5:2 D5:1 E5:1 G5:2 A5:2 G5:2 E5:2 C5:1 D5:1 E5:2 D5:4 -:2 E5:2 G5:1 A5:1 B5:2 A5:2 G5:1 E5:1 D5:2 E5:2 C5:2 D5:1 E5:1 C5:4 -:4'),
    bass: parse('C3:2 G3:2 C4:2 G3:2 A2:2 E3:2 A3:2 E3:2 F2:2 C3:2 F3:2 C3:2 G2:2 D3:2 G3:2 D3:2') },
  field: { bpm:144, lw:'square', lv:0.15,
    lead: parse('A4:1 C5:1 E5:2 A5:2 G5:1 E5:1 F5:2 D5:2 -:1 D5:1 E5:1 F5:1 G5:2 E5:2 C5:2 A4:2 B4:1 C5:1 D5:2 E5:4 A4:1 C5:1 E5:2 A5:2 B5:1 C6:1 B5:2 A5:2 G5:1 F5:1 E5:2 D5:1 C5:1 B4:2 G#4:2 A4:4 -:2'),
    bass: parse('A2:2 E3:2 A2:2 E3:2 F2:2 C3:2 F2:2 C3:2 D3:2 A3:2 E2:2 B2:2 A2:2 E3:2 A3:2 E3:2') },
  dark: { bpm:110, lw:'square', lv:0.13,
    lead: parse('E4:2 G4:2 A#4:2 A4:2 G4:2 E4:2 -:2 D4:2 E4:2 G4:2 A#4:1 A4:1 G4:2 D5:4 -:2 C5:2 A#4:2 A4:2 G4:4 E4:4 -:4'),
    bass: parse('E2:4 E2:4 C3:4 B2:4 E2:4 E2:4 A2:4 B2:4') },
  tavern: { bpm:170, lw:'triangle', lv:0.35,
    lead: parse('D5:1 F#5:1 A5:1 F#5:1 D5:1 F#5:1 G5:1 E5:1 C#5:1 E5:1 G5:1 E5:1 D5:1 F#5:1 A5:1 D6:1 C#6:1 B5:1 A5:1 G5:1 F#5:1 E5:1 D5:2 -:1 A4:1 D5:1 F#5:1 E5:1 D5:1 C#5:1 E5:1 A5:1 G5:1 F#5:1 E5:1 D5:3 -:3'),
    bass: parse('D3:3 A3:3 A2:3 E3:3 D3:3 A3:3 A2:3 D3:3') },
};
let music = null, musicName = null;
function playMusic(name){
  if (musicName === name && music) return;
  musicName = name;
  if (!AC || muted || !name) { music = null; return; }
  const t = AC.currentTime + 0.08;
  music = { li:0, bi:0, tl:t, tb:t };
}
function tickMusic(){
  if (!music || !AC || muted || !musicName) return;
  const s = SONGS[musicName], u = 60 / s.bpm / 2, now = AC.currentTime, hz = now + 0.2;
  if (music.tl < now - 0.1) music.tl = now; if (music.tb < now - 0.1) music.tb = now;
  while (music.tl < hz) { const [f, d] = s.lead[music.li]; if (f) noteAt(f, music.tl, d * u * 0.9, s.lw, s.lv); music.tl += d * u; music.li = (music.li + 1) % s.lead.length; }
  while (music.tb < hz) { const [f, d] = s.bass[music.bi]; if (f) noteAt(f, music.tb, d * u * 0.85, 'triangle', 0.42); music.tb += d * u; music.bi = (music.bi + 1) % s.bass.length; }
}
function toggleMute(){ muted = !muted; const n = musicName; musicName = null; music = null; if (!muted) playMusic(n); else musicName = n; }

/* ============ DRAW HELPERS ============ */
const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
function disc(cx, cy, r, col){
  ctx.fillStyle = col;
  for (let dy = -r; dy <= r; dy++) { const w = Math.floor(Math.sqrt(r * r - dy * dy)); ctx.fillRect(Math.round(cx - w), Math.round(cy + dy), w * 2 + 1, 1); }
}
function txt(s, x, y, col='#fff', al='left', sh='#000', size=8){
  ctx.font = `${size}px "Press Start 2P", ui-monospace, monospace`;
  ctx.textAlign = al; ctx.textBaseline = 'top';
  if (sh) { ctx.fillStyle = sh; ctx.fillText(s, x + 1, y + 1); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
const hash = i => { let h = Math.imul(i ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
const h2 = (a, b) => hash(Math.imul(a, 73856093) ^ Math.imul(b, 19349663));
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* tiny 3x5 font */
const F3 = {
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',
  G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',
  M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',
  S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',
  Y:'101101010010010',Z:'111001010100111','0':'111101101101111','1':'010110010010111','2':'110001010100111','3':'110001010001110',
  '4':'101101111001001','5':'111100110001110','6':'011100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001110',
  '.':'000000000000010',',':'000000000010100',':':'000010000010000','!':'010010010000010','?':'110001010000010','-':'000000111000000',
  "'":'010010000000000','/':'001001010100100','+':'000010111010000','(':'010100100100010',')':'010001001001010','$':'011110010011110',
  '%':'101001010100101','=':'000111000111000','<':'001010100010001','>':'100010001010100','*':'000101010101000'
};
const norm = s => String(s).toUpperCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[¡¿]/g, '');
function tiny(s, x, y, col='#fff', al='left'){
  s = norm(s);
  if (al === 'center') x = Math.round(x - (s.length * 4 - 1) / 2);
  else if (al === 'right') x = x - (s.length * 4 - 1);
  ctx.fillStyle = col;
  for (let i = 0; i < s.length; i++) {
    const g = F3[s[i]];
    if (g) for (let k = 0; k < 15; k++) if (g[k] === '1') ctx.fillRect(x + i * 4 + (k % 3), y + ((k / 3) | 0), 1, 1);
  }
}
function wrap(s, n){
  const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { if ((cur + (cur ? ' ' : '') + w).length > n) { if (cur) lines.push(cur); cur = w; } else cur += (cur ? ' ' : '') + w; }
  if (cur) lines.push(cur);
  return lines;
}

/* ============ BITMAP ICONS (card art for spells) ============ */
const ICON = {
  bolt:['......KKKK..','.....KYYYK..','....KYYYK...','...KYYYK....','..KYYYYYYK..','..KKKKYYK...','.....KYK....','....KYK.....','...KYK......','...KK.......','..K.........','............'],
  flame:['.....K......','....KOK.....','...KOOK.K...','..KOOOOKOK..','..KOYOOOOK..','.KOOYYOOOOK.','.KOYYYYOOOK.','.KOYYYYYOOK.','.KOOYYYYOOK.','..KOOYYOOK..','...KKKKKK...','............'],
  skull:['...KKKKKK...','..KWWWWWWK..','.KWWWWWWWWK.','.KWKKWWKKWK.','.KWKKWWKKWK.','.KWWWKKWWWK.','..KWWWWWWK..','...KWKWKWK..','...KWWWWWK..','....KKKKK...','............','............'],
  ritual:['.....K......','....KPK.....','...KPPK.....','...KPBPK....','..KPBBPK....','..KPBBBPK...','.KPBBBBBPK..','.KPBBBBBPK..','.KPPBBBPPK..','..KKPPPKK...','...KKKKK....','............'],
  hole:['............','............','..KKKKKKKK..','.KNNNNNNNNK.','KNBBBBBBBBNK','KNBBBBBBBBNK','.KNBBBBBBNK.','..KKKKKKKK..','...N...N....','..N.....N...','............','............'],
  sun:['.....YY.....','..Y..YY..Y..','...Y.KK.Y...','....KWWK....','YY.KWWWWK.YY','YY.KWWWWK.YY','....KWWK....','...Y.KK.Y...','..Y..YY..Y..','.....YY.....','............','............'],
  wave:['............','....KKK.....','..KKLLLK....','.KLLUUULK...','.KLUUKKUK...','KLUUK..K..K.','KLUUK....KLK','KUUUUK..KLUK','.KUUUUKKLUUK','..KKUUUUUUK.','....KKKKKK..','............'],
  swirl:['...KKKKKK...','..KLLLLLLK..','.KLUUUUUULK.','.KLUKKKKULK.','.KLUKLLKULK.','.KLUKLUKULK.','.KLUKUUKULK.','.KLUUKKUULK.','..KLUUUULK..','...KKKKKK...','............','............'],
  tome:['............','.KKKKKKKKKK.','.KNNNNNNNNK.','.KNYYYYYYNK.','.KNNNNNNNNK.','.KNNNYYNNNK.','.KNNNNNNNNK.','.KNNNNNNNNK.','.KWWWWWWWWK.','.KKKKKKKKKK.','............','............'],
  shield:['.KKKKKKKKKK.','.KWWWWWWWWK.','.KWWWYYWWWK.','.KWWWYYWWWK.','.KWYYYYYYWK.','.KWYYYYYYWK.','.KWWWYYWWWK.','..KWWYYWWK..','...KWWWWK...','....KWWK....','.....KK.....','............'],
  sword:['..........KK','.........KSK','........KSK.','.......KSK..','......KSK...','.....KSK....','..K.KSK.....','...KSK......','...NK.......','..NKNK......','.NK..K......','.K..........'],
  scroll:['..KKKKKKKK..','.KNWWWWWWNK.','..KWWWWWWK..','..KWKKKKWK..','..KWWWWWWK..','..KWKKKWWK..','..KWWWWWWK..','..KWKKKKWK..','..KWWWWWWK..','.KNWWWWWWNK.','..KKKKKKKK..','............'],
};
const IPAL = {K:'#1a1020',Y:'#fce040',O:'#f88820',R:'#d83020',W:'#f8f8f0',P:'#8a3ad0',B:'#18101c',N:'#8a5a30',U:'#2a6ad8',L:'#88c8f8',S:'#d0d8e0'};
function drawIcon(name, x, y, s){
  const rows = ICON[name];
  for (let r = 0; r < rows.length; r++) for (let c = 0; c < 12; c++) {
    const ch = rows[r][c]; if (!ch || ch === '.') continue;
    ctx.fillStyle = IPAL[ch]; ctx.fillRect(x + c * s, y + r * s, s, s);
  }
}

/* ============ DATA ============ */
const CHARS = [
  { id:'matias', n:'MATÍAS', tag:'EL PROTAGONISTA', style:'cap', st:{fue:5,des:5,agi:5,int:5}, main:'fue',
    c:{ hat:'#d8281c', hatD:'#8a1410', mark:'#ffffff', hair:'#9a4422', skin:'#f1b98a', shirt:'#10d9b8', shirtD:'#0a9580', pants:'#2b2f73', shoe:'#5a2e12' } },

function loadRoom(id, px, py){
  const d = ROOMS[id];
  G.roomId = id; G.def = d;
  G.map = d.map.map(r => r.split(''));
  for (const k in (d.chests || {})) if (S.chests[id + ':' + k]) { const [x, y] = k.split(',').map(Number); G.map[y][x] = 'C'; }
  G.enemies = []; G.items = []; G.parts = []; G.floats = [];
  for (const [t, x, y] of (d.enemies || [])) { if (MON[t].boss && S.bosses[t]) continue; spawnEnemy(t, x * TS, y * TS); }
  G.npcs = (d.npcs || []).map(n => ({ id:n.id, x:n.x * TS + 3, y:n.y * TS + 8, w:10, h:8, dir:0 }));
  PL.x = px; PL.y = py; PL.kb = 0; PL.atk = 0;
  G.cacheDirty = true; G.zoneT = d.interior ? 0 : 110; G.fade = 14;
  const boss = G.enemies.find(e => MON[e.type].boss);
  if (boss) { SFX.boss(); G.bossBar = boss; } else G.bossBar = null;
  playMusic(d.music);
  S.room = id; S.x = px; S.y = py; saveGame();
}
function spawnEnemy(type, x, y){
  const m = MON[type], s = m.size;
  const e = { type, x:x + 2, y:y + 2, w:s - 4, h:s - 4, hp:m.hp, max:m.hp, vx:0, vy:0, dir:rnd(4), t:rnd(60), st:'wander', stT:40 + rnd(60),
    flash:0, kb:0, kx:0, ky:0, lastSwing:-1, cd:60 + rnd(60), flip:false, nid:++NID };
  G.enemies.push(e); return e;
}
function blocked(x, y, w, h, fly){
  if (fly) return false;
  const x0 = Math.floor(x / TS), x1 = Math.floor((x + w - 0.01) / TS), y0 = Math.floor(y / TS), y1 = Math.floor((y + h - 0.01) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (ty < 0 || ty > 9 || tx < 0 || tx > 14) continue;
    if (SOLID.has(G.map[ty][tx])) return true;
  }
  return false;
}
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const npcHit = e => G.npcs.some(n => ov(e, n));
function moveBox(e, dx, dy, fly, isPlayer){
  let hit = 0;
  if (dx) {
    e.x += dx;
    if (blocked(e.x, e.y, e.w, e.h, fly) || (isPlayer && npcHit(e))) {
      e.x -= dx; hit |= 1;
      if (isPlayer && !dy) for (const s of [1, -1]) { let ok = false; for (let k = 1; k <= 6; k++) if (!blocked(e.x + dx, e.y + s * k, e.w, e.h) && !npcHit({...e, x:e.x + dx, y:e.y + s * k})) { e.y += s * 0.8; ok = true; break; } if (ok) break; }
    }
  }
  if (dy) {
    e.y += dy;
    if (blocked(e.x, e.y, e.w, e.h, fly) || (isPlayer && npcHit(e))) {
      e.y -= dy; hit |= 2;
      if (isPlayer && !dx) for (const s of [1, -1]) { let ok = false; for (let k = 1; k <= 6; k++) if (!blocked(e.x + s * k, e.y + dy, e.w, e.h) && !npcHit({...e, x:e.x + s * k, y:e.y + dy})) { e.x += s * 0.8; ok = true; break; } if (ok) break; }
    }
  }
  if (!isPlayer) { e.x = clamp(e.x, 0, W - e.w); e.y = clamp(e.y, 0, H - e.h); }
  return hit;
}
const DIRV = [[0,1],[0,-1],[-1,0],[1,0]];

function toast(s, col='#fff'){ G.toasts.push({ s, t:0, col }); if (G.toasts.length > 3) G.toasts.shift(); }

function addXP(n){
  S.xp += n;
  while (S.xp >= xpNeed()) {
    S.xp -= xpNeed(); S.lvl++;
    const main = CH().main, others = ['fue','des','agi','int'].filter(k => k !== main);
    S.st[main]++; S.st[pick(others)]++;
    if (S.lvl % 2 === 0) S.maxHp += 2;
    S.hp = S.maxHp;
    SFX.lvl(); toast('SUBISTE A NIVEL ' + S.lvl + '!', '#fcd84a');
  }
}
function addCard(id){
  const was = S.cards[id] || 0;
  S.cards[id] = was + 1;
  if (!was) {
    G.cardGet = { id, t:0 };
    SFX.card();
    for (const d of DECKS) if (d.cards.includes(id) && deckDone(d.id) && !S.complete[d.id]) {
      S.complete[d.id] = true; G.cardGet.done = d.n;
    }
  } else { SFX.coin(); toast('REPETIDA: ' + CARDS[id].n + ' (X' + (was + 1) + ')', '#c8d8e8'); }
  saveGame();
}
function addSword(id){

  S.swords.push(id); SFX.chest();

function dropLoot(e){
  const m = MON[e.type], cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  addXP(m.xp);
  const drop = (k, id, v) => G.items.push({ k, id, v, x:cx - 5 + rnd(10) - 5, y:cy - 5 + rnd(10) - 5, z:0, vz:-2.2, t:0 });
  if (m.boss) {
    S.bosses[e.type] = true; G.bossBar = null;
    drop('card', m.cards[0]); drop('sword', m.sword);
    for (let i = 0; i < 5; i++) drop('coin', null, 5);
    drop('heart'); saveGame(); return;
  }
  const chance = 0.25 + stats().des * 0.012;
  if (Math.random() < chance) {
    let id;
    if (Math.random() < 0.55) id = pick(m.cards);
    else { const decks = G.def.decks || ['burn']; id = pick(DECK[pick(decks)].cards); }
    drop('card', id);
  } else if (Math.random() < 0.6) drop('coin', null, Math.random() < 0.15 ? 5 : 1);
  if (Math.random() < 0.13) drop('heart');
  if (Math.random() < 0.03) { const opts = ['hierro','goblin','sombra','urza','mar'].filter(s => !S.swords.includes(s)); if (opts.length) drop('sword', pick(opts)); }
}

    if (c === 'S') { const s = G.def.signs && G.def.signs[tx + ',' + ty]; if (s) { say([s]); return true; } }

function changeRoom(side){

  if (side === 'n') y = H - PL.h - 2; if (side === 's') y = 2; if (side === 'w') x = W - PL.w - 2; if (side === 'e') x = 2;

}

function updateWorld(){

    }

          for (let i = 0; i < 4; i++) G.parts.push({ k:'spark', x:hx, y:hy, vx:(Math.random() - 0.5) * 3, vy:(Math.random() - 0.5) * 3, t:0 });
          if (e.remote) { e.flash = 10; if (NET.host && NET.host.open) NET.host.send({ t:'hit', room:G.roomId, id:e.nid, dmg, kx, ky }); }

        const r = Math.random();
        if (r < 0.25) G.items.push({ k:'coin', v:1, x:tx * TS + 4, y:ty * TS + 4, z:0, vz:-2, t:0 });
        else if (r < 0.35) G.items.push({ k:'heart', x:tx * TS + 4, y:ty * TS + 4, z:0, vz:-2, t:0 });
      }
    }
  }
  if (pressed('a')) { if (!tryInteract()) startAttack(); }

  if (pressed('menu')) { G.menu = { tab:0, sel:0, deck:null, cs:0 }; SFX.ok(); return; }

  if (here === 'E' && G.def.exitTo) { SFX.door(); const e = G.def.exitTo; loadRoom(e.room, e.tx * TS + 3, e.ty * TS + 6); p.dir = 0; return; }
  if (p.x < -3) { if (!changeRoom('w')) p.x = -3; } else if (p.x + p.w > W + 3) { if (!changeRoom('e')) p.x = W + 3 - p.w; }

function updateEnemies(){
  const p = PL;
  const hurt = { x:p.x, y:p.y - 7, w:10, h:15 };
  if (clientSynced()) {
    for (const e of G.enemies) {
      e.t++; if (e.flash > 0) e.flash--;
      if (e.tx !== undefined) { e.x += (e.tx - e.x) * 0.4; e.y += (e.ty - e.y) * 0.4; }
      if (ov(hurt, { x:e.x + 1, y:e.y + 1, w:e.w - 2, h:e.h - 2 })) hurtPlayer(MON[e.type].dmg, e.x + e.w / 2, e.y + e.h / 2);
    }
    return;
  }
  for (const e of G.enemies) e.remote = false;
  const targets = [{ x:p.x + 5, y:p.y + 4 }].concat(othersHere().map(o => ({ x:o.x + 5, y:o.y + 4 })));
  for (const e of G.enemies) {
    if (e.dead) continue;
    const m = MON[e.type];
    e.t++; if (e.flash > 0) e.flash--;
    const fly = m.ai === 'fly';
    if (e.kb > 0) { e.kb--; moveBox(e, e.kx, e.ky, fly); continue; }
    const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
    let tg = targets[0], best = Infinity;
    for (const t of targets) { const d = Math.hypot(t.x - ex, t.y - ey); if (d < best) { best = d; tg = t; } }
    const dx = tg.x - ex, dy = tg.y - ey, dist = Math.hypot(dx, dy) || 1;
    let mx = 0, my = 0, sp = m.spd;
    const wander = () => {
      if (--e.stT <= 0) { e.dir = rnd(5); e.stT = 50 + rnd(90); }
      if (e.dir < 4) { mx = DIRV[e.dir][0]; my = DIRV[e.dir][1]; }
    };
    switch (m.ai) {
      case 'chase': if (dist < 100) { mx = dx / dist; my = dy / dist; } else wander(); break;
      case 'charge':
        if (e.st === 'charge') { mx = e.cx; my = e.cy; sp = m.spd * 2.8; if (--e.stT <= 0) { e.st = 'rest'; e.stT = 40; } }
        else if (e.st === 'rest') { if (--e.stT <= 0) { e.st = 'wander'; e.stT = 30; } }
        else {
          wander();
          if (dist < 110 && (Math.abs(dx) < 10 || Math.abs(dy) < 10) && --e.cd <= 0) {
            e.st = 'charge'; e.stT = 36; e.cd = 50;
            if (Math.abs(dx) < 10) { e.cx = 0; e.cy = Math.sign(dy); } else { e.cx = Math.sign(dx); e.cy = 0; }
          }
        }
        break;
      case 'fly': { const w = Math.sin(e.t * 0.05) * 0.8; mx = dx / dist + (-dy / dist) * w; my = dy / dist + (dx / dist) * w; if (dist > 130) { mx *= 0.3; my *= 0.3; } break; }
      case 'healer':
        if (dist < 40) { mx = -dx / dist; my = -dy / dist; } else wander();
        if (--e.cd <= 0) {
          e.cd = 150;
          for (const o of G.enemies) if (o !== e && !o.dead && o.hp < o.max && Math.hypot(o.x - e.x, o.y - e.y) < 60) {
            o.hp = Math.min(o.max, o.hp + 1); SFX.heal();
            for (let i = 0; i < 5; i++) G.parts.push({ k:'heal', x:o.x + o.w / 2 + (Math.random() - 0.5) * 12, y:o.y + o.h, vx:0, vy:-0.6 - Math.random() * 0.4, t:0 });
          }
        }
        break;
      case 'siege':
        if (dist < 200) { mx = dx / dist; my = dy / dist; }
        if (--e.cd <= 0) {
          e.cd = 200;
          if (G.enemies.filter(o => !o.dead && o.type === 'gob').length < 4) {
            SFX.summon();
            for (const s of [-1, 1]) { const g = spawnEnemy('gob', e.x + 8 + s * 22, e.y + 10); if (blocked(g.x, g.y, g.w, g.h)) { g.x = e.x + 8; g.y = e.y + 8; } }
          }
        }
        break;
      case 'dread':
        if (e.st === 'tele') { e.x += (e.t % 4 < 2 ? 0.5 : -0.5); if (--e.stT <= 0) { e.st = 'dash'; e.stT = 40; e.cx = dx / dist; e.cy = dy / dist; SFX.boss(); } }
        else if (e.st === 'dash') { mx = e.cx; my = e.cy; sp = 3.1; if (--e.stT <= 0) { e.st = 'wander'; e.cd = 140; } }
        else { if (dist < 200) { mx = dx / dist; my = dy / dist; } if (--e.cd <= 0) { e.st = 'tele'; e.stT = 30; } }
        break;
    }
    if (mx || my) {
      const hit = moveBox(e, mx * sp, my * sp, fly);
      if (hit && (m.ai === 'chase' || e.dir < 4)) { e.dir = rnd(4); e.stT = 30; }
      if (hit && e.st === 'charge') { e.st = 'rest'; e.stT = 30; }
      if (hit && e.st === 'dash') { e.st = 'wander'; e.cd = 140; }
      if (Math.abs(mx) > 0.2) e.flip = mx < 0;
    }
    if (ov(hurt, { x:e.x + 1, y:e.y + 1, w:e.w - 2, h:e.h - 2 })) hurtPlayer(m.dmg, ex, ey);
  }
  G.enemies = G.enemies.filter(e => !e.dead);
}

}

function missingCards(){ return ALL_CARDS.filter(id => !owned(id)); }
function dupes(){ const out = []; for (const id of ALL_CARDS) for (let i = 1; i < (S.cards[id] || 0); i++) out.push(id); return out; }
function talkTo(id){

      'Dicen que en el bosque hay un goblin enorme que llama a otros goblins. Ten cuidado.',

          for (let i = 0; i < 8; i++) G.parts.push({ k:'bubble', x:PL.x + 5 + (Math.random() - 0.5) * 10, y:PL.y - 8, vx:0, vy:-0.5 - Math.random() * 0.4, t:0 });

          const decks = DECKS.filter(k => !deckDone(k.id));

          say(['¿De qué mazo quieres la carta?'], decks.slice(0, 5).map(k => ({ t:k.n, fn:() => {

          const n = d.length; d.forEach(c => S.cards[c]--); S.coins += n * 4; SFX.coin();
          say(['Te compré ' + n + ' repetidas por $' + (n * 4) + '.']); saveGame();
        } },
      { t:'NADA', fn:null }]);
  } else if (id === 'klaus') {
    const d = dupes(), miss = missingCards();
    if (d.length && miss.length && Math.random() < 0.6) {

        [{ t:'TRATO', fn:() => { S.cards[give]--; say(['¡Buena! Salud.'], null, () => addCard(want)); } }, { t:'NO', fn:() => say(['Tú te lo pierdes.']) }]);
    } else {
      say([pick([

/* ============ TOURNAMENT ============ */
const OPP_NAMES = ['TÍO PELAO','LA FEÑA','DON WACHO','EL POLLO','SEBA','LA COTE','EL FLACO','KLAUS','KIKE','LA PANCHI'];
const LOOKS = ['curly','spiky','bun','bald','cap','beanie'];
function randomLook(name){
  if (name === 'KLAUS') return NPCDEF.klaus;
  const pal = ['#d8402a','#3a7ae8','#48a860','#8a4ad0','#e8a028','#2a2a38','#c83a78'];
  const hair = pick(['#141014','#5a3a1c','#9a4422','#f0d070','#d8d8e0']);
  const sh = pick(pal);
  return { style:pick(LOOKS), c:{ hat:pick(pal), hatD:'#1a1020', hair, hairD:hair, skin:pick(['#f1c9a0','#e8a878','#b87a4b','#fbdcc4']), shirt:sh, shirtD:'#1a1020', pants:'#2a2a38', shoe:'#1a1020' } };
}
function startTour(deck){
  const names = [...OPP_NAMES].sort(() => Math.random() - 0.5).slice(0, 3);
  G.tour = { deck, round:0, wins:0, phase:'vs', t:0, buzz:S.buzz, opps:names.map(n => ({ n, deck:pick(DECKS).id, look:randomLook(n) })), ev:[], ei:0, lives:[20, 20], cur:null, pops:[] };
  S.buzz = 0; S.beers = 0;
  G.state = 'tour'; playMusic('field'); SFX.ok();
  prepRound();
}
function prepRound(){
  const T_ = G.tour, o = T_.opps[T_.round];
  const pw = clamp(0.5 + mu(T_.deck, o.deck) + (stats().int - 5) * 0.03 + T_.buzz * 0.02 - T_.round * 0.04, 0.15, 0.88);
  T_.pwin = pw; T_.iwin = Math.random() < pw;
  T_.ev = genDuel(T_.deck, o.deck, T_.iwin); T_.ei = 0; T_.lives = [20, 20]; T_.cur = null; T_.phase = 'vs'; T_.t = 0; T_.pops = [];
}
function genDuel(myDeck, oppDeck, iWin){
  const L = [20, 20], ev = [], winner = iWin ? 0 : 1; let turn = rnd(2), guard = 0;
  while (L[0] > 0 && L[1] > 0 && guard++ < 60) {
    const deck = turn === 0 ? myDeck : oppDeck, card = pick(DECK[deck].cards), isW = turn === winner, opp = 1 - turn;
    let dmg = isW ? 3 + rnd(4) : 1 + rnd(4), heal = 0;
    if (deck === 'life' && Math.random() < 0.4) { heal = 2 + rnd(4); dmg = 0; }
    else if ((deck === 'replenish' || deck === 'langostino') && Math.random() < 0.25) dmg = 0;
    if (!isW) dmg = Math.min(dmg, L[opp] - 1);
    if (guard > 40 && isW) dmg = L[opp];
    L[opp] -= dmg; L[turn] += heal;
    ev.push({ who:turn, card, dmg, heal, lives:[L[0], L[1]] });
    turn = opp;
  }

  const has = !!loadSave();
  const opts = has ? ['CONTINUAR', 'NUEVA PARTIDA'] : ['NUEVA PARTIDA'];
  opts.forEach((o, i) => {
    const y = 126 + i * 13, sel = i === G.titleSel;
    txt(o, 120, y, sel ? '#fcd84a' : '#c8d8d0', 'center', '#000');
    if (sel) { const w = o.length * 8; R(120 - w / 2 - 12, y + 1, 2, 6, '#fcd84a'); R(120 - w / 2 - 10, y + 2, 2, 4, '#fcd84a'); }
  });
}
function updateTitle(){
  const has = !!loadSave(), n = has ? 2 : 1;
  if (pressed('up') || pressed('down')) { G.titleSel = (G.titleSel + 1) % n; SFX.move(); }
  if (G.titleSel >= n) G.titleSel = 0;
  if (pressed('a') || pressed('menu')) {
    audioInit(); SFX.ok();
    if (has && G.titleSel === 0) { S = loadSave(); G.state = 'world'; loadRoom(S.room, S.x, S.y); }
    else { G.state = 'select'; G.sel = 0; }
  }
}
function drawSelect(){
  R(0, 0, W, H, '#10161a');
  for (let i = 0; i < 15; i++) R(i * 16, 104, 16, 56, i % 2 ? '#1c2a2e' : '#18242a');
  txt('ELIGE PERSONAJE', 120, 8, '#fcd84a', 'center', '#7a3a10');
  CHARS.forEach((c, i) => {
    const cx = 40 + i * 80, sel = i === G.sel, bob = sel ? Math.round(Math.abs(Math.sin(frame * 0.12)) * -4) : 0;
    ctx.save(); ctx.translate(cx - 24, 30 + bob); ctx.scale(3, 3); drawPerson(0, 0, c, sel ? 0 : 0, sel ? (frame >> 4) & 1 : 0); ctx.restore();
    if (sel) { R(cx - 26, 84, 52, 2, '#fcd84a'); }
    txt(c.n, cx, 90, sel ? '#fcd84a' : '#fff', 'center', '#000');
  });
  const c = CHARS[G.sel];
  tiny(c.tag, 120, 104, '#10d9b8', 'center');
  [['FUE','fue'],['DES','des'],['AGI','agi'],['INT','int']].forEach(([l, k], i) => {
    const x = 16 + (i % 2) * 112, y = 116 + Math.floor(i / 2) * 12;
    tiny(l, x, y + 1, '#9db8a8');
    for (let j = 0; j < 8; j++) R(x + 18 + j * 9, y, 8, 6, j < c.st[k] ? '#fcd84a' : '#2a3a3a');
  });
  tiny(TOUCH ? '< > ELIGE    A: EMPEZAR' : '< > ELIGE    Z: EMPEZAR', 120, 148, '#6a8a80', 'center');
}
function updateSelect(){
  if (pressed('left')) { G.sel = (G.sel + 2) % 3; SFX.move(); }
  if (pressed('right')) { G.sel = (G.sel + 1) % 3; SFX.move(); }
  if (pressed('b')) { G.state = 'title'; SFX.back(); }
  if (pressed('a') || pressed('menu')) {
    SFX.ok();
    S = newSave(G.sel); G.state = 'world';
    loadRoom('pueblo', S.x, S.y);
    say(['Bienvenido a VILLA PREMODERN, ' + CHARS[G.sel].n + '.',
      'Por aquí las criaturas salen de las cartas... y cuando las derrotas, sueltan cartas.',
      'Junta un mazo completo (8 cartas) y juega el torneo en la ARENA.',
      '¿Sed? En la TABERNA hay cerveza y gente para cambiar cartas.',
      TOUCH ? 'A: atacar. B: hablar. MENÚ: tus mazos, espadas y estado.' : 'Z: atacar. X: hablar. ENTER: tus mazos, espadas y estado.']);
  }
}

/* ============ ONLINE (co-op en vivo, PeerJS) ============ */
const NET = { role:null, peer:null, conns:[], host:null, pid:null, code:null, others:{}, hostRoom:null, gotEn:0 };
let NID = 0;
const netEl = id => document.getElementById(id);
function netStatus(s){ const el = netEl('netStatus'); if (el) el.textContent = s; }
function genCode(){ const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = ''; for (let i = 0; i < 4; i++) s += a[rnd(a.length)]; return s; }
function netReady(){
  if (!window.Peer) { netStatus('No se pudo cargar el modo online (revisa tu internet).'); return false; }
  if (!S || G.state !== 'world') { netStatus('Primero entra al juego (nueva partida o continuar).'); return false; }
  return true;
}
function netLeave(silent){
  try { NET.peer && NET.peer.destroy(); } catch(_) {}
  NET.role = null; NET.peer = null; NET.conns = []; NET.host = null; NET.others = {}; NET.hostRoom = null; NET.pid = null;
  for (const e of G.enemies) e.remote = false;
  if (!silent) netStatus('Juegas solo.');
}
function netHost(){
  if (!netReady()) return;
  netLeave(true);
  const code = genCode(), peer = new Peer('pmq-' + code.toLowerCase());
  Object.assign(NET, { peer, role:'host', code, pid:'h' });
  netStatus('Creando sala...');
  peer.on('open', () => netStatus('SALA ' + code + ' · pásale este código a tus amigos.'));
  peer.on('connection', c => {
    c.on('open', () => {
      if (NET.conns.length >= 2) { c.send({ t:'full' }); setTimeout(() => c.close(), 300); return; }
      c.pid = 'p' + (++NID); NET.conns.push(c); c.send({ t:'hello', pid:c.pid });
      SFX.ok(); netStatus('SALA ' + code + ' · ' + (NET.conns.length + 1) + ' jugadores.');
    });
    c.on('data', d => hostRecv(c, d));
    c.on('close', () => {
      const o = NET.others[c.pid]; NET.conns = NET.conns.filter(x => x !== c); delete NET.others[c.pid];
      if (o) toast(o.name + ' SE FUE'); netStatus('SALA ' + code + ' · ' + (NET.conns.length + 1) + ' jugadores.');
    });
  });
  peer.on('error', e => { if (e.type === 'unavailable-id') netHost(); else netStatus('Error online: ' + e.type); });
}
function netJoin(){
  if (!netReady()) return;
  const code = (netEl('netCode').value || '').trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)) { netStatus('El código son 4 letras.'); return; }
  netLeave(true);
  const peer = new Peer();
  Object.assign(NET, { peer, role:'client', code });
  netStatus('Conectando a ' + code + '...');
  peer.on('open', () => {
    const c = peer.connect('pmq-' + code.toLowerCase(), { reliable:true });
    NET.host = c;
    c.on('open', () => { netStatus('Conectado a la sala ' + code + '.'); SFX.ok(); });
    c.on('data', d => clientRecv(d));
    c.on('close', () => { if (NET.role === 'client') { toast('SE CORTO LA SALA'); netLeave(true); netStatus('Se cortó la conexión. Juegas solo.'); } });
  });
  peer.on('error', e => netStatus(e.type === 'peer-unavailable' ? 'No existe la sala ' + code + '.' : 'Error online: ' + e.type));
}
function myState(){
  return { pid:NET.pid, name:CH().n, ch:S.ch, room:G.roomId, x:Math.round(PL.x), y:Math.round(PL.y), dir:PL.dir, atk:PL.atk, walk:Math.floor(PL.walk) % 2, hp:S.hp, max:S.maxHp };
}
const sendAll = m => { for (const c of NET.conns) if (c.open) c.send(m); };
function sendTo(pid, m){ if (NET.role === 'host') { const c = NET.conns.find(x => x.pid === pid); if (c && c.open) c.send(m); } }
function hostRecv(c, d){
  if (d.t === 'st') { d.pid = c.pid; const o = NET.others[c.pid]; if (!o) toast(d.name + ' SE UNIO', '#60e070'); NET.others[c.pid] = Object.assign(o || { rx:d.x, ry:d.y }, d); }
  else if (d.t === 'hit') {
    if (d.room !== G.roomId || G.state !== 'world') return;
    const e = G.enemies.find(o => o.nid === d.id && !o.dead);
    if (e) applyHit(e, d.dmg, d.kx, d.ky);
  } else if (d.t === 'gift') {
    if (d.to === 'h') receiveGift(d); else sendTo(d.to, d);
  }
}
function clientRecv(d){
  if (d.t === 'hello') NET.pid = d.pid;
  else if (d.t === 'full') { netStatus('La sala está llena (máximo 3).'); netLeave(true); }
  else if (d.t === 'pl') {
    const seen = {};
    for (const s of d.list) {
      if (s.pid === NET.pid) continue;
      seen[s.pid] = true;
      if (s.pid === 'h') NET.hostRoom = s.room;
      const o = NET.others[s.pid]; if (!o) toast(s.name + ' ESTA EN LA SALA', '#60e070');
      NET.others[s.pid] = Object.assign(o || { rx:s.x, ry:s.y }, s);
    }
    for (const k in NET.others) if (!seen[k]) delete NET.others[k];
  }
  else if (d.t === 'en') { if (G.state === 'world' && d.room === G.roomId) applyEnemySnap(d.list); }
  else if (d.t === 'kill') {
    if (G.state !== 'world' || d.room !== G.roomId) return;
    const e = G.enemies.find(o => o.nid === d.id && o.remote);
    const fake = e || spawnEnemy(d.type, d.x, d.y);
    fake.remote = true; killEnemy(fake, true);
  }
  else if (d.t === 'gift') receiveGift(d);
}
function receiveGift(d){ if (!S || !CARDS[d.card]) return; toast('REGALO DE ' + d.from + '!', '#fcd84a'); addCard(d.card); }
function sendGift(to, card){
  if ((S.cards[card] || 0) < 1) return;
  S.cards[card]--; saveGame();
  const m = { t:'gift', to, card, from:CH().n };
  if (NET.role === 'host') sendTo(to, m); else if (NET.host) NET.host.send(m);
  toast('REGALASTE ' + CARDS[card].n, '#c8d8e8'); SFX.ok();
}
const clientSynced = () => NET.role === 'client' && NET.hostRoom === G.roomId && frame - NET.gotEn < 60;
function applyEnemySnap(list){
  NET.gotEn = frame;
  const seen = new Set();
  for (const [id, type, x, y, hp, max, flip, fl] of list) {
    seen.add(id);
    let e = G.enemies.find(o => o.remote && o.nid === id);
    if (!e) { e = spawnEnemy(type, x - 2, y - 2); e.nid = id; e.remote = true; e.x = x; e.y = y; }
    e.tx = x; e.ty = y; e.hp = hp; e.max = max; e.flip = !!flip; if (fl && e.flash <= 0) e.flash = 6;
  }
  G.enemies = G.enemies.filter(e => e.remote && seen.has(e.nid));
  const boss = G.enemies.find(e => MON[e.type].boss); G.bossBar = boss || null;
}
function applyHit(e, dmg, kx, ky){
  e.hp -= dmg; e.flash = 10; e.kb = 8; e.kx = kx; e.ky = ky;
  if (e.hp <= 0) killEnemy(e);
}
function netTick(){
  if (!NET.role || !S || G.state === 'title' || G.state === 'select') return;
  for (const k in NET.others) { const o = NET.others[k]; o.rx += (o.x - o.rx) * 0.35; o.ry += (o.y - o.ry) * 0.35; }
  if (frame % 4) return;
  if (NET.role === 'host') {
    if (!NET.conns.length) return;
    const list = [myState()].concat(Object.values(NET.others).map(o => ({ pid:o.pid, name:o.name, ch:o.ch, room:o.room, x:o.x, y:o.y, dir:o.dir, atk:o.atk, walk:o.walk, hp:o.hp, max:o.max })));
    sendAll({ t:'pl', list });
    if (G.state === 'world') sendAll({ t:'en', room:G.roomId, list:G.enemies.filter(e => !e.dead).map(e => [e.nid, e.type, Math.round(e.x), Math.round(e.y), e.hp, e.max, e.flip ? 1 : 0, e.flash > 0 ? 1 : 0]) });
  } else if (NET.host && NET.host.open) {
    NET.host.send(Object.assign({ t:'st' }, myState()));
  }
}
const othersHere = () => Object.values(NET.others).filter(o => o.room === G.roomId);
netEl('netHost').addEventListener('click', () => { audioInit(); netHost(); });
netEl('netJoin').addEventListener('click', () => { audioInit(); netJoin(); });
netEl('netLeave').addEventListener('click', () => { if (NET.role) toast('SALISTE DE LA SALA'); netLeave(); });
netEl('netCode').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') netJoin(); });
netEl('netCode').addEventListener('keyup', e => e.stopPropagation());

/* ============ MAIN LOOP ============ */
function step(){
  readInput(); frame++; G.t++;
  if (G.state === 'title') updateTitle();
  else if (G.state === 'select') updateSelect();
  else if (G.state === 'tour') updateTour();
  else if (G.state === 'world') {
    if (G.fade > 0) G.fade--;
    if (G.cardGet) { G.cardGet.t++; if (G.cardGet.t > 30 && (pressed('a') || pressed('b'))) { const done = G.cardGet.done; G.cardGet = null; SFX.ok(); if (done) toast('¡MAZO ' + done + ' COMPLETO!', '#fcd84a'); } }
    else if (G.dialog) updateDialog();
    else if (G.menu) updateMenu();
    else if (G.dead) {
      G.dead++;
      if (G.dead > 150) {
        G.dead = 0; S.hp = S.maxHp; S.coins = Math.floor(S.coins / 2); PL.inv = 60;
        loadRoom('pueblo', 7 * TS + 3, 6 * TS + 6);
        say(['Despertaste en el pueblo. Perdiste la mitad de tus monedas.']);
      }
    }
    else updateWorld();
    if ((G.cardGet || G.dialog || G.menu) && NET.role === 'host' && NET.conns.length) { updateEnemies(); updateParts(); }
    for (const t of G.toasts) if (G.dialog || G.menu) t.t = Math.min(t.t, 140);
  }
  netTick();
  tickMusic();
}
function render(){
  if (G.state === 'title') drawTitle();
  else if (G.state === 'select') drawSelect();
  else if (G.state === 'tour') drawTour();
  else if (G.state === 'world') {
    if (G.menu) drawMenu();
    else {
      drawWorld();
      if (G.dead) { ctx.fillStyle = `rgba(90,0,0,${Math.min(0.75, G.dead / 60)})`; ctx.fillRect(0, 0, W, H); if (G.dead > 40) txt('TE DESMAYASTE...', 120, 72, '#fff', 'center', '#000'); }
      if (G.cardGet) drawCardGet();
      if (G.dialog) drawDialog();
    }
    if (G.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${G.fade / 14})`; ctx.fillRect(0, 0, W, H); }
  }
}
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
cvs.addEventListener('pointerdown', () => { audioInit(); cvs.focus(); });
addEventListener('pagehide', saveGame);
const go = () => requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').then(() => { G.cacheDirty = true; go(); }, go); else go();
})();
</script>

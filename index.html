<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magic Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{ color-scheme: dark; --bg:#10161a; --panel:#1c2a2e; --ink:#eef6ee; --muted:#9db8a8; --gold:#fcd84a; --line:#2e4a44; --leaf:#5cae44; }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Press Start 2P", ui-monospace, "Courier New", monospace;padding-inline:16px;box-sizing:border-box}
  .wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:12px}
  h1{margin:0;font-size:clamp(12px,3.4vw,18px);color:var(--gold);text-shadow:3px 3px 0 #7a3a10;letter-spacing:.06em;text-align:center}
  .screen{width:min(100%, calc((100dvh - 170px) * 1.5)); max-width:960px; min-width:240px}
  canvas{display:block;width:100%;aspect-ratio:3/2;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;border:4px solid #000;box-shadow:0 0 0 4px var(--line),0 10px 0 4px #070b0d;box-sizing:border-box;touch-action:none}
  canvas:focus-visible{outline:3px solid var(--gold);outline-offset:6px}
  .keys{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 18px;font-size:8px;color:var(--muted);line-height:1.8;max-width:700px}
  .keys span{white-space:nowrap}
  kbd{font-family:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;padding:2px 5px;border-radius:3px}
  .pad{display:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;gap:10px;user-select:none;-webkit-user-select:none}
  .dpad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:2px}
  .pad button{font-family:inherit;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-bottom-width:6px;border-radius:10px;font-size:14px;touch-action:none;padding:0}
  .dpad button{width:54px;height:54px}
  .dpad .u{grid-column:2;grid-row:1}.dpad .l{grid-column:1;grid-row:2}.dpad .r{grid-column:3;grid-row:2}.dpad .d{grid-column:2;grid-row:3}
  .acts{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
  .acts .row{display:flex;gap:12px;align-items:center}
  .acts .ab{width:64px;height:64px;border-radius:50%}
  .acts .a{background:#b8321a;border-color:#6a1a0a}
  .acts .b{background:#2a6a3a;border-color:#12401e}
  .acts .m{width:78px;height:34px;font-size:9px}
  .pad button:active,.pad button.on{transform:translateY(3px);border-bottom-width:3px}
  .net{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px 10px;font-size:8px;color:var(--muted);max-width:700px}
  .net button,.net input{font-family:inherit;font-size:9px;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-bottom-width:4px;border-radius:6px;padding:8px 10px}
  .net button{cursor:pointer}
  .net button:focus-visible,.net input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .net input{width:92px;text-transform:uppercase;letter-spacing:.2em;text-align:center}
  .net #netStatus{flex-basis:100%;text-align:center;color:var(--gold);line-height:1.6}
  @media (pointer:coarse){ .pad{display:flex} .keys{display:none} .screen{width:min(100%, calc((100dvh - 250px) * 1.5))} }
</style>
</head>
<body>
<div class="wrap">
  <h1>MAGIC QUEST</h1>
  <div class="screen"><canvas id="game" width="240" height="160" tabindex="0" aria-label="Juego de rol de acción con cartas"></canvas></div>
  <div class="keys">
    <span><kbd>Flechas</kbd>/<kbd>WASD</kbd> moverse</span>
    <span><kbd>Z</kbd>/<kbd>Espacio</kbd> atacar · aceptar</span>
    <span><kbd>X</kbd> hablar · volver</span>
    <span><kbd>Enter</kbd> menú</span>
    <span><kbd>M</kbd> sonido</span>
  </div>
  <div class="pad" id="pad">
    <div class="dpad">
      <button class="u" data-k="up" aria-label="Arriba">▲</button>
      <button class="l" data-k="left" aria-label="Izquierda">◀</button>
      <button class="r" data-k="right" aria-label="Derecha">▶</button>
      <button class="d" data-k="down" aria-label="Abajo">▼</button>
    </div>
    <div class="acts">
      <div class="row">
        <button class="ab b" data-k="b" aria-label="Hablar">B</button>
        <button class="ab a" data-k="a" aria-label="Atacar">A</button>
      </div>
      <button class="m" data-k="menu" aria-label="Menú">MENÚ</button>
    </div>
  </div>
  <div class="net">
    <button id="btnTitle" type="button">⌂ Menú principal</button>
  </div>
  <div class="net" id="net">
    <span>ONLINE:</span>
    <button id="netHost" type="button">Crear sala</button>
    <input id="netCode" maxlength="4" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters" aria-label="Código de sala">
    <button id="netJoin" type="button">Unirse</button>
    <button id="netLeave" type="button">Salir</button>
    <span id="netStatus">Juega solo o crea una sala para jugar con amigos (hasta 3).</span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(() => {
'use strict';
const cvs = document.getElementById('game');
let ctx = cvs.getContext('2d');
const MAIN = ctx;
ctx.imageSmoothingEnabled = false;
const W = 240, H = 160, TS = 16;
let frame = 0;
const TOUCH = matchMedia('(pointer:coarse)').matches;

/* ============ INPUT ============ */
const K = {up:0,down:0,left:0,right:0,a:0,b:0,menu:0};
const prevK = {...K};
const kb = {}, touch = {};
const keyMap = {ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  KeyZ:'a',Space:'a',KeyJ:'a',KeyX:'b',KeyK:'b',Backspace:'b',Enter:'menu',Escape:'menu',KeyI:'menu'};
addEventListener('keydown', e => {
  audioInit();
  if (e.code === 'KeyM' && !e.repeat) toggleMute();
  const k = keyMap[e.code]; if (k) { kb[k] = 1; e.preventDefault(); }
});
addEventListener('keyup', e => { const k = keyMap[e.code]; if (k) { kb[k] = 0; e.preventDefault(); } });
addEventListener('blur', () => { for (const k in kb) kb[k] = 0; });
document.querySelectorAll('#pad button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); audioInit(); touch[k] = 1; b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch(_) {} };
  const off = e => { e.preventDefault(); touch[k] = 0; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
function readInput(){ Object.assign(prevK, K); for (const k in K) K[k] = (kb[k] || touch[k]) ? 1 : 0; }
const pressed = k => K[k] && !prevK[k];

/* ============ AUDIO ============ */
let AC = null, master = null, muted = false;
function audioInit(){
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = 0.15; master.connect(AC.destination); } catch(_) { AC = null; }
}
function tone(f1, f2, dur, type='square', vol=0.5, delay=0){
  if (!AC || muted) return;
  const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t);
  if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noteAt(f, t, dur, type, vol){
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
const seq = (arr, dt, type='square', vol=0.45) => arr.forEach((f, i) => tone(f, f, dt * 1.1, type, vol, i * dt));
const SFX = {
  swing: () => tone(520, 200, 0.08, 'triangle', 0.4),
  hit:   () => tone(320, 80, 0.08, 'square', 0.5),
  kill:  () => seq([420, 300, 190], 0.05),
  coin:  () => { tone(988, 988, 0.05, 'square', 0.35); tone(1319, 1319, 0.2, 'square', 0.35, 0.05); },
  card:  () => seq([659, 880, 1175, 1568], 0.07, 'square', 0.4),
  heart: () => seq([880, 1175], 0.06, 'triangle', 0.5),
  hurt:  () => tone(240, 90, 0.2, 'sawtooth', 0.4),
  talk:  () => tone(880, 880, 0.02, 'square', 0.12),
  move:  () => tone(660, 660, 0.03, 'square', 0.25),
  ok:    () => seq([660, 990], 0.05, 'square', 0.35),
  back:  () => seq([500, 330], 0.05, 'square', 0.3),
  lvl:   () => seq([523, 659, 784, 1047, 784, 1047, 1319], 0.08),
  door:  () => tone(200, 120, 0.15, 'triangle', 0.5),
  chest: () => seq([392, 494, 587, 784, 988], 0.07),
  beer:  () => seq([300, 250, 210, 260, 330], 0.07, 'triangle', 0.55),
  win:   () => seq([523, 659, 784, 1047, 1319], 0.1),
  lose:  () => seq([392, 330, 262, 196], 0.14),
  bush:  () => tone(900, 300, 0.06, 'sawtooth', 0.25),
  boss:  () => tone(90, 60, 0.4, 'sawtooth', 0.5),
  summon:() => tone(200, 420, 0.2, 'square', 0.4),
  heal:  () => seq([1047, 1319, 1568], 0.04, 'triangle', 0.3),
};
/* ============ MÚSICA (temas originales estilo RPG de Super Nintendo) ============ */
const midiF = m => 440 * Math.pow(2, (m - 69) / 12);
const NOTE = n => {
  if (n === '-') return 0;
  const mm = /^([A-G])(#?)(\d)$/.exec(n);
  const idx = {C:0,D:2,E:4,F:5,G:7,A:9,B:11}[mm[1]] + (mm[2] ? 1 : 0);
  return midiF(12 * (+mm[3] + 1) + idx);
};
const parse = s => s.trim().split(/\s+/).map(t => { const [n, d] = t.split(':'); return [n.includes('+') ? n.split('+').map(NOTE) : NOTE(n), +d]; });
const PC = { C:0, D:2, E:4, F:5, G:7, A:9, B:11 };
function chordInfo(c){
  const mm = /^([A-G])(b|#)?(m|dim)?$/.exec(c);
  const root = (PC[mm[1]] + (mm[2] === 'b' ? -1 : mm[2] === '#' ? 1 : 0) + 12) % 12;
  return { root, third: mm[3] ? 3 : 4, fifth: mm[3] === 'dim' ? 6 : 7 };
}
const DRUMS = {
  none:[], soft:['K:2 -:2 H:2 -:2'], march:['K:1 H:1 S:1 H:1 K:1 K:1 S:1 H:1'],
  battle:['K:1 H:1 S:1 K:1 K:1 H:1 S:1 H:1'], reel:['K:1 H:1 -:1 H:1 K:1 H:1 -:1 H:1'], dark:['K:4 -:2 H:2'],
};
function makeSong(o){
  const pad = [], bass = [], arp = [], drum = [];
  for (const c of o.chords) {
    const { root, third, fifth } = chordInfo(c), r3 = 48 + root;
    pad.push([[midiF(r3), midiF(r3 + third), midiF(r3 + fifth)], 8]);
    const b2 = 36 + root;
    if (o.bass === 'pump') for (let i = 0; i < 8; i++) bass.push([midiF(i % 2 ? b2 + 12 : b2), 1]);
    else if (o.bass === 'walk') { bass.push([midiF(b2), 2], [midiF(b2 + fifth), 2], [midiF(b2 + 12), 2], [midiF(b2 + fifth), 2]); }
    else if (o.bass === 'whole') bass.push([midiF(b2), 8]);
    else bass.push([midiF(b2), 4], [midiF(b2 + fifth), 4]);
    const tri = [r3 + 12, r3 + 12 + third, r3 + 12 + fifth, r3 + 24];
    const pat = o.arpPat || [0, 1, 2, 3, 2, 1, 2, 1];
    for (const k of pat) arp.push([midiF(tri[k]), 1]);
    for (const t of ((DRUMS[o.drums || 'none'][0]) || '-:8').trim().split(/\s+/)) { const [s, d] = t.split(':'); drum.push([s, +d]); }
  }
  const lead = parse(o.lead), total = o.chords.length * 8;
  let len = lead.reduce((a, [, d]) => a + d, 0);
  if (len < total) lead.push([0, total - len]);
  const tracks = [
    { inst:o.leadInst || 'lead', vol:o.leadVol || 0.13, notes:lead },
    { inst:'strings', vol:o.padVol ?? 0.035, notes:pad },
    { inst:'bass', vol:o.bassVol || 0.32, notes:bass },
  ];
  if (o.arp !== false) tracks.push({ inst:o.arpInst || 'harp', vol:o.arpVol || 0.07, notes:arp });
  if (o.drums && o.drums !== 'none') tracks.push({ inst:'drum', vol:o.drumVol || 0.3, notes:drum.map(([s, d]) => [s, d]) });
  if (o.counter) tracks.push({ inst:'flute', vol:0.06, notes:parse(o.counter) });
  return { bpm:o.bpm, tracks };
}
// los nombres con 'b' (Bb, Eb, Ab) son acordes; las melodías usan sostenidos (A#4 = Si bemol)
const SONGS = {
  title: makeSong({ bpm:96, chords:['Cm','Ab','Eb','Bb','Cm','Ab','Bb','Bb'], leadInst:'brass', leadVol:0.1, bass:'half', drums:'soft', padVol:0.045,
    lead:'G4:4 C5:2 D5:2 D#5:4 D5:2 C5:2 G5:6 F5:1 D#5:1 D5:8 C5:2 D5:2 D#5:2 G5:2 G#5:4 G5:2 F5:2 F5:3 D#5:1 D5:2 F5:2 G5:8' }),
  town: makeSong({ bpm:92, chords:['F','C','Dm','Bb','F','C','Bb','C'], leadInst:'flute', leadVol:0.1, bass:'half', drums:'none', arpPat:[0,1,2,1,3,1,2,1],
    lead:'C5:3 A4:1 F4:2 A4:2 G4:3 E4:1 C4:2 E4:2 F4:2 A4:2 D5:3 C5:1 A#4:4 A4:2 G4:2 A4:3 C5:1 F5:2 E5:1 D5:1 C5:4 G4:2 A4:1 A#4:1 D5:3 C5:1 A#4:2 A4:2 G4:6 -:2' }),
  field: makeSong({ bpm:132, chords:['Dm','Bb','F','C','Dm','Bb','C','A','Gm','Dm','Bb','C','Dm','Bb','A','A'], leadInst:'brass', leadVol:0.1, bass:'pump', drums:'march',
    lead:'D5:3 A4:1 D5:2 F5:2 F5:3 D5:1 A#4:2 D5:2 A4:2 C5:2 F5:3 E5:1 E5:4 G5:2 E5:2 D5:3 A4:1 D5:2 F5:2 A#5:3 A5:1 G5:2 F5:2 G5:3 F5:1 E5:2 C5:2 C#5:4 E5:2 A5:2 ' +
         'A#5:3 A5:1 G5:2 D5:2 F5:3 E5:1 D5:2 A4:2 A#4:2 D5:2 F5:2 A#5:2 A5:3 G5:1 E5:2 C5:2 D5:3 E5:1 F5:2 A5:2 G5:3 F5:1 D5:2 A#4:2 C#5:3 E5:1 A5:2 G5:2 A5:6 -:2' }),
  dark: makeSong({ bpm:84, chords:['Am','F','E','Am','Dm','Am','E','E'], leadInst:'flute', leadVol:0.09, bass:'whole', drums:'dark', padVol:0.05, arpPat:[0,2,1,2,0,2,1,2], arpVol:0.05,
    lead:'A4:6 C5:2 A4:4 F4:4 G#4:6 B4:2 A4:8 F4:4 A4:2 D5:2 C5:4 E4:4 G#4:3 A4:1 B4:2 E5:2 E5:8' }),
  boss: makeSong({ bpm:152, chords:['Em','C','D','B','Em','C','Am','B'], leadInst:'brass', leadVol:0.11, bass:'pump', drums:'battle', drumVol:0.34, arpInst:'lead', arpVol:0.035,
    lead:'E5:1 E5:1 G5:1 E5:1 B5:2 A5:2 G5:2 E5:2 C5:2 E5:2 F#5:2 D5:2 A5:2 F#5:2 D#5:4 F#5:2 B5:2 E5:1 E5:1 G5:1 B5:1 E6:2 D6:2 C6:2 B5:2 G5:2 E5:2 A5:2 C6:2 E6:2 C6:2 B5:6 D#5:2' }),
  tavern: makeSong({ bpm:168, chords:['D','G','D','A','D','G','A','D'], leadInst:'flute', leadVol:0.1, bass:'walk', drums:'reel', drumVol:0.22, arpVol:0.05,
    lead:'F#5:1 A5:1 D6:1 A5:1 F#5:1 A5:1 F#5:1 E5:1 D5:1 G5:1 B5:1 G5:1 D5:1 G5:1 B5:1 D6:1 A5:1 F#5:1 D5:1 F#5:1 A5:2 F#5:1 D5:1 E5:1 C#5:1 A4:1 C#5:1 E5:2 A5:2 ' +
         'F#5:1 A5:1 D6:1 A5:1 F#5:1 D5:1 E5:1 F#5:1 G5:1 B5:1 D6:1 B5:1 G5:2 E5:2 E5:1 F#5:1 G5:1 E5:1 C#5:1 A4:1 C#5:1 E5:1 D5:4 A4:2 D5:2' }),
  fanfare: makeSong({ bpm:120, chords:['C','F','G','C','Am','F','G','G'], leadInst:'brass', leadVol:0.11, bass:'walk', drums:'march',
    lead:'G4:2 C5:2 E5:2 G5:2 F5:3 E5:1 D5:2 C5:2 D5:3 E5:1 F5:2 D5:2 E5:4 C5:2 G4:2 A4:2 C5:2 E5:2 A5:2 F5:3 G5:1 A5:2 F5:2 G5:3 F5:1 E5:2 D5:2 D5:6 -:2' }),
};
let music = null, musicName = null, musicBus = null, noiseBuf = null;
function ensureBus(){
  if (musicBus || !AC) return;
  musicBus = AC.createGain(); musicBus.gain.value = 0.9; musicBus.connect(master);
  const dl = AC.createDelay(1), fb = AC.createGain(), wet = AC.createGain();
  dl.delayTime.value = 0.27; fb.gain.value = 0.3; wet.gain.value = 0.28;
  musicBus.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master);
  noiseBuf = AC.createBuffer(1, AC.sampleRate * 0.3, AC.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function voice(inst, f, t, dur, vol){
  const g = AC.createGain(); g.connect(musicBus);
  const env = (a, rel) => { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + a); g.gain.setValueAtTime(vol, Math.max(t + a, t + dur - rel)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur + rel * 0.5); };
  const osc = (type, fr, det = 0, dest = g) => { const o = AC.createOscillator(); o.type = type; o.frequency.setValueAtTime(fr, t); o.detune.value = det; o.connect(dest); o.start(t); o.stop(t + dur + 0.4); return o; };
  const vib = (o, depth) => { if (dur < 0.3) return; const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = 5.5; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(depth, t + 0.25); l.connect(lg); lg.connect(o.frequency); l.start(t); l.stop(t + dur + 0.4); };
  switch (inst) {
    case 'lead': env(0.015, 0.08); vib(osc('square', f), f * 0.006); break;
    case 'flute': env(0.05, 0.12); vib(osc('triangle', f), f * 0.008); osc('sine', f * 2, 0, (() => { const h = AC.createGain(); h.gain.value = 0.25; h.connect(g); return h; })()); break;
    case 'brass': { const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.setValueAtTime(900, t); lp.frequency.linearRampToValueAtTime(2600, t + 0.08); lp.connect(g); env(0.03, 0.1); vib(osc('sawtooth', f, -5, lp), f * 0.005); osc('sawtooth', f, 6, lp); break; }
    case 'strings': { const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1300; lp.connect(g); env(Math.min(0.35, dur * 0.3), 0.3); for (const fr of (Array.isArray(f) ? f : [f])) { osc('sawtooth', fr, -7, lp); osc('sawtooth', fr, 7, lp); } break; }
    case 'harp': g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(0.9, dur * 2 + 0.2)); osc('triangle', f); break;
    case 'bass': env(0.01, 0.06); osc('triangle', f); osc('sine', f / 2, 0, (() => { const h = AC.createGain(); h.gain.value = 0.5; h.connect(g); return h; })()); break;
    case 'drum': {

      else { const s = AC.createBufferSource(), hp = AC.createBiquadFilter(); s.buffer = noiseBuf; hp.type = 'highpass'; hp.frequency.value = f === 'S' ? 1400 : 7000; s.connect(hp); hp.connect(g);

function loadRoom(id, px, py){
  const d = getDef(id);

  if (S.visited) S.visited[zoneOf(id)] = true;
  PL.lock = Math.floor((px + 5) / TS) + ',' + Math.floor((py + 4) / TS);
  G.map = d.map.map(r => r.split(''));
  for (const k in (d.chests || {})) if (S.chests[id + ':' + k]) { const [x, y] = k.split(',').map(Number); G.map[y][x] = 'C'; }
  G.enemies = []; G.items = []; G.parts = []; G.floats = [];
  for (const [t, x, y] of (d.enemies || [])) {
    if (MON[t].boss && S.bosses[t]) continue;
    const e = spawnEnemy(t, x * TS, y * TS);
    if (d.mult && d.mult !== 1) { e.hp = e.max = Math.round(e.hp * d.mult); e.dmgMult = d.mult > 1.6 ? 2 : 1; }
  }
  const friendChars = CHARS.map((_, i) => i).filter(i => i !== S.ch);
  G.npcs = (d.npcs || []).filter(n => !(n.id === 'klaus' && CHARS[S.ch].id === 'klaus')).map(n => ({ id:n.id, x:n.x * TS + 3, y:n.y * TS + 8, w:10, h:8, dir:0,
    ch: n.id === 'friend' ? friendChars[n.slot] : undefined }));
  PL.x = px; PL.y = py; PL.kb = 0; PL.atk = 0;
  G.cacheDirty = true; G.zoneT = d.interior ? 0 : 110; G.fade = 14;
  const boss = G.enemies.find(e => MON[e.type].boss);
  if (boss) { SFX.boss(); G.bossBar = boss; } else G.bossBar = null;
  playMusic(boss ? 'boss' : d.music);
  S.room = id; S.x = px; S.y = py; saveGame();
}
function spawnEnemy(type, x, y){
  const m = MON[type], s = m.size;
  const e = { type, x:x + 2, y:y + 2, w:s - 4, h:s - 4, hp:m.hp, max:m.hp, vx:0, vy:0, dir:rnd(4), t:rnd(60), st:'wander', stT:40 + rnd(60),
    flash:0, kb:0, kx:0, ky:0, lastSwing:-1, cd:60 + rnd(60), flip:false, nid:++NID };
  G.enemies.push(e); return e;
}
function blocked(x, y, w, h, fly){
  if (fly) return false;
  const x0 = Math.floor(x / TS), x1 = Math.floor((x + w - 0.01) / TS), y0 = Math.floor(y / TS), y1 = Math.floor((y + h - 0.01) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (ty < 0 || ty > 9 || tx < 0 || tx > 14) continue;
    if (SOLID.has(G.map[ty][tx])) return true;
  }
  return false;
}
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const npcHit = e => G.npcs.some(n => ov(e, n));
function moveBox(e, dx, dy, fly, isPlayer){
  let hit = 0;
  if (dx) {
    e.x += dx;
    if (blocked(e.x, e.y, e.w, e.h, fly) || (isPlayer && npcHit(e))) {
      e.x -= dx; hit |= 1;
      if (isPlayer && !dy) for (const s of [1, -1]) { let ok = false; for (let k = 1; k <= 6; k++) if (!blocked(e.x + dx, e.y + s * k, e.w, e.h) && !npcHit({...e, x:e.x + dx, y:e.y + s * k})) { e.y += s * 0.8; ok = true; break; } if (ok) break; }
    }
  }
  if (dy) {
    e.y += dy;
    if (blocked(e.x, e.y, e.w, e.h, fly) || (isPlayer && npcHit(e))) {
      e.y -= dy; hit |= 2;
      if (isPlayer && !dx) for (const s of [1, -1]) { let ok = false; for (let k = 1; k <= 6; k++) if (!blocked(e.x + s * k, e.y + dy, e.w, e.h) && !npcHit({...e, x:e.x + s * k, y:e.y + dy})) { e.x += s * 0.8; ok = true; break; } if (ok) break; }
    }
  }
  if (!isPlayer) { e.x = clamp(e.x, 0, W - e.w); e.y = clamp(e.y, 0, H - e.h); }
  return hit;
}
const DIRV = [[0,1],[0,-1],[-1,0],[1,0]];

function toast(s, col='#fff'){ G.toasts.push({ s, t:0, col }); if (G.toasts.length > 3) G.toasts.shift(); }

function addXP(n){
  S.xp += n;
  while (S.xp >= xpNeed()) {
    S.xp -= xpNeed(); S.lvl++;
    const main = CH().main, others = ['fue','des','agi','int'].filter(k => k !== main);
    S.st[main]++; S.st[pick(others)]++;
    if (S.lvl % 2 === 0) S.maxHp += 2;
    S.hp = S.maxHp;
    SFX.lvl(); toast('SUBISTE A NIVEL ' + S.lvl + '!', '#fcd84a');
  }
}
function addCard(id){
  const was = S.cards[id] || 0;
  S.cards[id] = was + 1;
  if (!was) {
    const cg = { id, t:0 };
    for (const d of DECKS) if (d.cards.includes(id) && deckDone(d.id) && !S.complete[d.id]) {
      S.complete[d.id] = true; cg.done = d.n;
    }
    if (G.cardGet) G.cardQueue.push(cg); else { G.cardGet = cg; SFX.card(); }
  } else { SFX.coin(); toast('REPETIDA: ' + CARDS[id].n + ' (X' + (was + 1) + ')', '#c8d8e8'); }
  saveGame();
}
function addSword(id){
  if (S.swords.includes(id)) { S.coins += 15; toast('ESPADA REPETIDA: +$15', '#fcd84a'); SFX.coin(); return; }
  S.swords.push(id); SFX.chest();
  const cur = SWORDS[S.eq].st, nw = SWORDS[id].st, sum = o => Object.values(o).reduce((a, b) => a + b, 0);
  const auto = sum(nw) > sum(cur);
  if (auto) S.eq = id;
  say(['¡Encontraste ' + SWORDS[id].n.toUpperCase() + '!', statLine(nw) + (auto ? ' (equipada)' : ' (equípala en el menú)')]);
  saveGame();
}
const statLine = st => Object.entries(st).map(([k, v]) => '+' + v + ' ' + k.toUpperCase()).join(' ') || 'SIN BONOS';

function dropLoot(e){
  const m = MON[e.type], cx = e.x + e.w / 2, cy = e.y + e.h / 2;
  addXP(m.xp);
  const drop = (k, id, v) => G.items.push({ k, id, v, x:cx - 5 + rnd(10) - 5, y:cy - 5 + rnd(10) - 5, z:0, vz:-2.2, t:0 });
  if (m.boss) {
    S.bosses[e.type] = true; G.bossBar = null; playMusic(G.def.music);
    if (G.def.bossFloor) { G.map[4][7] = 'O'; G.cacheDirty = true; }
    if (GUARDIANS.includes(e.type)) toast('GUARDIANES DERROTADOS: ' + guardiansDone() + '/5', '#fcd84a');
    drop('card', m.cards[0]); drop('sword', m.sword);
    for (let i = 0; i < 5; i++) drop('coin', null, 5);
    drop('heart'); saveGame(); return;
  }
  const chance = 0.25 + stats().des * 0.012;
  if (Math.random() < chance) {
    let id;
    if (Math.random() < 0.55) id = pick(m.cards);
    else { const decks = G.def.decks || ['burn']; id = pick(DECK[pick(decks)].cards); }
    drop('card', id);
  } else if (Math.random() < 0.6) drop('coin', null, Math.random() < 0.15 ? 5 : 1);
  if (Math.random() < 0.13) drop('heart');
  if (Math.random() < 0.03) { const opts = ['hierro','goblin','sombra','urza','mar'].filter(s => !S.swords.includes(s)); if (opts.length) drop('sword', pick(opts)); }
}
function killEnemy(e){
  if (e.dead) return;
  e.dead = true; SFX.kill(); questKill(e.type);
  if (NET.role === 'host') sendAll({ t:'kill', room:G.roomId, id:e.nid, type:e.type, x:Math.round(e.x), y:Math.round(e.y) });
  for (let i = 0; i < 8; i++) G.parts.push({ k:'smoke', x:e.x + e.w / 2, y:e.y + e.h / 2, vx:Math.cos(i * 0.785) * 1.2, vy:Math.sin(i * 0.785) * 1.2, t:0 });

function hurtPlayer(dmg, fx, fy){
  if (PL.inv > 0 || G.dead) return;
  S.hp -= dmg; PL.inv = 60; PL.kb = 10;
  const dx = PL.x + 5 - fx, dy = PL.y + 4 - fy, d = Math.hypot(dx, dy) || 1;

function swordPose(){
  const pr = 1 - PL.atk / ATK;
  const base = [Math.PI / 2, -Math.PI / 2, Math.PI, 0][PL.dir];
  return { ang: base - 1.25 + pr * 2.5, cx: PL.x + 5, cy: PL.y - 2 };
}
function startAttack(){

function interactPoint(dist){ const [dx, dy] = DIRV[PL.dir]; return { x: PL.x + 5 + dx * dist, y: PL.y + 4 + dy * dist }; }
function tryInteract(){
  for (const dist of [11, 20]) {
    const pt = interactPoint(dist);
    for (const n of G.npcs) if (pt.x > n.x - 4 && pt.x < n.x + n.w + 4 && pt.y > n.y - 10 && pt.y < n.y + n.h + 4) {
      n.dir = PL.dir === 0 ? 1 : PL.dir === 1 ? 0 : PL.dir === 2 ? 3 : 2;

    }
    const tx = Math.floor(pt.x / TS), ty = Math.floor(pt.y / TS), c = T(tx, ty);
    if (c === 'Z') { arcadePrompt(); return true; }
    if (c === 'S') { const s = G.def.signs && G.def.signs[tx + ',' + ty]; if (s) { say([s]); return true; } }
    if (c === 'c') {
      const key = G.roomId + ':' + tx + ',' + ty;
      G.map[ty][tx] = 'C'; S.chests[key] = true; G.cacheDirty = true;

function findTile(def, ch){ for (let y = 0; y < 10; y++) { const x = def.map[y].indexOf(ch); if (x >= 0) return [x, y]; } return [7, 5]; }
function goTo(id, ch){ const d = getDef(id), [x, y] = findTile(d, ch); SFX.door(); loadRoom(id, x * TS + 3, y * TS + 4); }
function useStairs(c){
  const d = G.def;
  if (c === 'M' && d.dungeon) { goTo('D:' + d.dungeon + ':1', 'U'); toast(DUNGEONS[d.dungeon].name, '#fcd84a'); return true; }

  return false;
}
function changeRoom(side){

  if (side === 'n') y = H - PL.h - 2; if (side === 's') y = 2; if (side === 'w') x = W - PL.w - 2; if (side === 'e') x = 2;

function updateWorld(){
  const p = PL;
  if (G.zoneT > 0) G.zoneT--;
  if (p.inv > 0) p.inv--; if (p.atkCd > 0) p.atkCd--;
  if (p.kb > 0) { p.kb--; moveBox(p, p.kx, p.ky, false, true); p.kx *= 0.85; p.ky *= 0.85; }
  else if (p.atk <= 0) {
    let mx = (K.right ? 1 : 0) - (K.left ? 1 : 0), my = (K.down ? 1 : 0) - (K.up ? 1 : 0);
    if (mx || my) {
      const sp = speed() * (G.map[Math.floor((p.y + 4) / TS)] && G.map[Math.floor((p.y + 4) / TS)][Math.floor((p.x + 5) / TS)] === 'm' ? 0.6 : 1);
      const n = Math.hypot(mx, my);
      moveBox(p, mx / n * sp, my / n * sp, false, true);
      p.walk += sp * 0.1;
      if (mx && !my) p.dir = mx < 0 ? 2 : 3;
      else if (my && !mx) p.dir = my < 0 ? 1 : 0;
      else { const cur = DIRV[p.dir]; if (!((cur[0] && cur[0] === mx) || (cur[1] && cur[1] === my))) p.dir = my < 0 ? 1 : 0; }
    }
  }
  if (p.atk > 0) {
    p.atk--;
    const { ang, cx, cy } = swordPose(), st = stats();
    for (const d of [8, 13, 18]) {
      const hx = cx + Math.cos(ang) * d, hy = cy + Math.sin(ang) * d;
      for (const e of G.enemies) {
        if (e.dead || e.lastSwing === G.swing) continue;
        const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
        if (Math.hypot(hx - ex, hy - ey) < e.w / 2 + 4) {
          e.lastSwing = G.swing;
          const crit = Math.random() < st.des * 0.03;
          const dmg = (1 + Math.floor(st.fue / 3)) * (crit ? 2 : 1);
          SFX.hit();
          floatText(crit ? dmg + '!' : String(dmg), ex, e.y - 4, crit ? '#fcd84a' : '#fff');
          const kd = Math.hypot(ex - cx, ey - cy) || 1, kf = MON[e.type].boss ? 0.6 : 2.6;
          const kx = (ex - cx) / kd * kf, ky = (ey - cy) / kd * kf;
          for (let i = 0; i < 4; i++) G.parts.push({ k:'spark', x:hx, y:hy, vx:(Math.random() - 0.5) * 3, vy:(Math.random() - 0.5) * 3, t:0 });
          if (e.remote) { e.flash = 10; if (NET.host && NET.host.open) NET.host.send({ t:'hit', room:G.roomId, id:e.nid, dmg, kx, ky }); }
          else applyHit(e, dmg, kx, ky);
        }
      }
      const tx = Math.floor(hx / TS), ty = Math.floor(hy / TS);
      if (T(tx, ty) === 'b') {
        G.map[ty][tx] = '.'; G.cacheDirty = true; SFX.bush();
        for (let i = 0; i < 6; i++) G.parts.push({ k:'leaf', x:tx * TS + 8, y:ty * TS + 8, vx:(Math.random() - 0.5) * 2.5, vy:-Math.random() * 2.5, t:0 });
        const r = Math.random();

        else if (r < 0.35) G.items.push({ k:'heart', x:tx * TS + 4, y:ty * TS + 4, z:0, vz:-2, t:0 });

  // doors & exits
  const ctx_ = Math.floor((p.x + 5) / TS), cty = Math.floor((p.y + 4) / TS);

  if (!PL.lock && (here === 'M' || here === 'U' || here === 'V' || here === 'O')) { if (useStairs(here)) return; }
  if (here === 'D' && G.def.doors && G.def.doors[ctx_ + ',' + cty]) { SFX.door(); loadRoom(G.def.doors[ctx_ + ',' + cty], 7 * TS + 3, 7 * TS + 4); p.dir = 1; return; }

  if (p.x < -3) { if (!changeRoom('w')) p.x = -3; } else if (p.x + p.w > W + 3) { if (!changeRoom('e')) p.x = W + 3 - p.w; }
  if (p.y < -3) { if (!changeRoom('n')) p.y = -3; } else if (p.y + p.h > H + 3) { if (!changeRoom('s')) p.y = H + 3 - p.h; }
  if (G.roomId !== S.room) return;

  updateEnemies();
  updateItems();
  updateParts();
  if (frame % 300 === 0) { S.x = p.x; S.y = p.y; saveGame(); }
}

function updateEnemies(){
  const p = PL;
  const hurt = { x:p.x, y:p.y - 7, w:10, h:15 };
  if (clientSynced()) {
    for (const e of G.enemies) {
      e.t++; if (e.flash > 0) e.flash--;
      if (e.tx !== undefined) { e.x += (e.tx - e.x) * 0.4; e.y += (e.ty - e.y) * 0.4; }
      if (ov(hurt, { x:e.x + 1, y:e.y + 1, w:e.w - 2, h:e.h - 2 })) hurtPlayer(MON[e.type].dmg, e.x + e.w / 2, e.y + e.h / 2);
    }
    return;
  }
  for (const e of G.enemies) e.remote = false;
  const targets = [{ x:p.x + 5, y:p.y + 4 }].concat(othersHere().map(o => ({ x:o.x + 5, y:o.y + 4 })));
  for (const e of G.enemies) {
    if (e.dead) continue;
    const m = MON[e.type];
    e.t++; if (e.flash > 0) e.flash--;
    const fly = m.ai === 'fly' || !!m.fly;
    if (e.kb > 0) { e.kb--; moveBox(e, e.kx, e.ky, fly); continue; }
    const ex = e.x + e.w / 2, ey = e.y + e.h / 2;
    let tg = targets[0], best = Infinity;
    for (const t of targets) { const d = Math.hypot(t.x - ex, t.y - ey); if (d < best) { best = d; tg = t; } }
    const dx = tg.x - ex, dy = tg.y - ey, dist = Math.hypot(dx, dy) || 1;
    let mx = 0, my = 0, sp = m.spd;
    const wander = () => {
      if (--e.stT <= 0) { e.dir = rnd(5); e.stT = 50 + rnd(90); }
      if (e.dir < 4) { mx = DIRV[e.dir][0]; my = DIRV[e.dir][1]; }
    };
    switch (m.ai) {
      case 'chase': if (dist < 100) { mx = dx / dist; my = dy / dist; } else wander(); break;
      case 'charge':
        if (e.st === 'charge') { mx = e.cx; my = e.cy; sp = m.spd * 2.8; if (--e.stT <= 0) { e.st = 'rest'; e.stT = 40; } }
        else if (e.st === 'rest') { if (--e.stT <= 0) { e.st = 'wander'; e.stT = 30; } }
        else {
          wander();
          if (dist < 110 && (Math.abs(dx) < 10 || Math.abs(dy) < 10) && --e.cd <= 0) {
            e.st = 'charge'; e.stT = 36; e.cd = 50;
            if (Math.abs(dx) < 10) { e.cx = 0; e.cy = Math.sign(dy); } else { e.cx = Math.sign(dx); e.cy = 0; }
          }
        }
        break;
      case 'fly': { const w = Math.sin(e.t * 0.05) * 0.8; mx = dx / dist + (-dy / dist) * w; my = dy / dist + (dx / dist) * w; if (dist > 130) { mx *= 0.3; my *= 0.3; } break; }
      case 'healer':
        if (dist < 40) { mx = -dx / dist; my = -dy / dist; } else wander();
        if (--e.cd <= 0) {
          e.cd = 150;
          for (const o of G.enemies) if (o !== e && !o.dead && o.hp < o.max && Math.hypot(o.x - e.x, o.y - e.y) < 60) {
            o.hp = Math.min(o.max, o.hp + 1); SFX.heal();
            for (let i = 0; i < 5; i++) G.parts.push({ k:'heal', x:o.x + o.w / 2 + (Math.random() - 0.5) * 12, y:o.y + o.h, vx:0, vy:-0.6 - Math.random() * 0.4, t:0 });
          }
        }
        break;
      case 'siege':
        if (dist < 200) { mx = dx / dist; my = dy / dist; }
        if (--e.cd <= 0) {
          e.cd = 200;
          const sum = m.summon || 'gob';
          if (G.enemies.filter(o => !o.dead && o.type === sum).length < 4) {
            SFX.summon();
            for (const s of [-1, 1]) { const g = spawnEnemy(sum, e.x + 8 + s * 22, e.y + 10); if (blocked(g.x, g.y, g.w, g.h)) { g.x = e.x + 8; g.y = e.y + 8; } }
          }
        }
        break;
      case 'dread':
        if (e.st === 'tele') { e.x += (e.t % 4 < 2 ? 0.5 : -0.5); if (--e.stT <= 0) { e.st = 'dash'; e.stT = 40; e.cx = dx / dist; e.cy = dy / dist; SFX.boss(); } }
        else if (e.st === 'dash') { mx = e.cx; my = e.cy; sp = 3.1; if (--e.stT <= 0) { e.st = 'wander'; e.cd = 140; } }
        else { if (dist < 200) { mx = dx / dist; my = dy / dist; } if (--e.cd <= 0) { e.st = 'tele'; e.stT = 30; } }
        break;
    }
    if (mx || my) {
      const hit = moveBox(e, mx * sp, my * sp, fly);
      if (hit && (m.ai === 'chase' || e.dir < 4)) { e.dir = rnd(4); e.stT = 30; }
      if (hit && e.st === 'charge') { e.st = 'rest'; e.stT = 30; }
      if (hit && e.st === 'dash') { e.st = 'wander'; e.cd = 140; }
      if (Math.abs(mx) > 0.2) e.flip = mx < 0;
    }
    if (ov(hurt, { x:e.x + 1, y:e.y + 1, w:e.w - 2, h:e.h - 2 })) hurtPlayer(m.dmg * (e.dmgMult || 1), ex, ey);
  }
  G.enemies = G.enemies.filter(e => !e.dead);
}
function updateItems(){
  const p = PL, box = { x:p.x - 1, y:p.y - 6, w:12, h:14 };
  for (const it of G.items) {
    it.t++;
    if (it.vz !== 0 || it.z < 0) { it.z += it.vz; it.vz += 0.25; if (it.z >= 0) { it.z = 0; it.vz = Math.abs(it.vz) > 1 ? -Math.abs(it.vz) * 0.4 : 0; } }
    if (it.t > 12 && ov(box, { x:it.x, y:it.y, w:10, h:10 })) {

function updateParts(){
  for (const q of G.parts) { q.t++; q.x += q.vx; q.y += q.vy; if (q.k === 'leaf') q.vy += 0.12; if (q.k === 'bubble') q.vx = Math.sin(q.t * 0.2) * 0.3; if (q.t > (q.k === 'heal' || q.k === 'bubble' ? 40 : 22)) q.dead = true; }
  G.parts = G.parts.filter(q => !q.dead);

function say(pages, choices, onEnd){
  const lines = [];
  for (const p of pages) { const l = wrap(p, 27); for (let i = 0; i < l.length; i += 3) lines.push(l.slice(i, i + 3)); }
  G.dialog = { pages:lines, pi:0, ch:0, choices:choices || null, sel:0, onEnd:onEnd || null, showChoices:false };
}
function updateDialog(){
  const d = G.dialog, page = d.pages[d.pi], full = page.join('\n').length;
  if (d.showChoices) {
    if (pressed('up')) { d.sel = (d.sel + d.choices.length - 1) % d.choices.length; SFX.move(); }
    if (pressed('down')) { d.sel = (d.sel + 1) % d.choices.length; SFX.move(); }
    if (pressed('a')) { const c = d.choices[d.sel]; G.dialog = null; SFX.ok(); c.fn && c.fn(); }
    else if (pressed('b')) { const c = d.choices[d.choices.length - 1]; G.dialog = null; SFX.back(); c.fn && c.fn(); }
    return;
  }
  if (d.ch < full) { d.ch += 2; if (frame % 3 === 0) SFX.talk(); if (pressed('a') || pressed('b')) d.ch = full; return; }
  if (pressed('a') || pressed('b')) {
    if (d.pi < d.pages.length - 1) { d.pi++; d.ch = 0; SFX.move(); }
    else if (d.choices) { d.showChoices = true; SFX.move(); }
    else { G.dialog = null; d.onEnd && d.onEnd(); }
  }
}
function drawDialog(){
  const d = G.dialog, page = d.pages[d.pi];
  R(4, 114, 232, 42, '#1a1020'); R(5, 115, 230, 40, '#f8f0dc'); R(7, 117, 226, 36, '#fffaf0');

  page.forEach((l, i) => { const s = l.slice(0, Math.max(0, left)); left -= l.length + 1; txt(s, 10, 120 + i * 11, '#2a2030', 'left', null); });
  if (d.ch >= page.join('\n').length && !d.showChoices && (frame >> 4) & 1) { R(224, 147, 5, 3, '#2a2030'); R(225, 150, 3, 1, '#2a2030'); }
  if (d.showChoices) {

  }
}

const GIVER_PLACE = { vecina:'VILLA', cronista:'VILLA', cantinero:'TABERNA DE LA VILLA', klaus:'TABERNA DE LA VILLA', coleccionista:'TABERNA DE LA VILLA',
  organizador:'ARENA DE LA VILLA', pescador:'VALPO', marinero:'VALPO', viejo:'CASA DEL VIEJO (VALPO)', juez:'TOLARIA', fan2:'TOLARIA',
  tendero:'TIENDA (TOLARIA)', posadera:'POSADA (TOLARIA)', arcadeOrg:'ARCADE (TOLARIA)' };
const STN = { fue:'FUE', des:'DES', agi:'AGI', int:'INT' };
const rewardText = r => [Object.entries(r.st || {}).map(([k, v]) => '+' + v + ' ' + STN[k]).join(' '), r.maxHp ? '+' + r.maxHp / 2 + ' CORAZÓN' : '', r.coins ? '$' + r.coins : ''].filter(Boolean).join(', ');
const killsOf = ts => ts.reduce((a, t) => a + ((S.kills || {})[t] || 0), 0);
function questBase(q){ const Q = QUESTS[q]; return Q.type === 'kill' ? killsOf(Q.target) : Q.type === 'killAll' ? (S.killsTotal || 0) : Q.type === 'beer' ? (S.beerTotal || 0) : 0; }
function questProg(q){
  const Q = QUESTS[q], st = S.quests[q], base = st ? st.base : 0;
  switch (Q.type) {
    case 'kill': return killsOf(Q.target) - base;
    case 'killAll': return (S.killsTotal || 0) - base;
    case 'beer': return (S.beerTotal || 0) - base;
    case 'visit': return Object.keys(S.visited || {}).length;
    case 'guardians': return guardiansDone();
    case 'trophy': return S.trophies;
    case 'decks': return DECKS.filter(d => deckDone(d.id)).length;
    case 'boss': return S.bosses[Q.target] ? 1 : 0;
    case 'cards': return totalCards();
    case 'arcade': return S.arcadeBest || 0;
  }
  return 0;
}
const questsOf = id => Object.keys(QUESTS).filter(q => QUESTS[q].giver === id);
function questMarker(id){
  if (!S || !S.quests) return null;
  const list = questsOf(id); if (!list.length) return null;
  if (list.some(q => S.quests[q] && S.quests[q].st === 'active' && questProg(q) >= QUESTS[q].n)) return '?';
  if (!list.some(q => S.quests[q] && S.quests[q].st === 'active') && list.some(q => !S.quests[q])) return '!';
  return null;
}
function questHook(id, npc){
  const list = questsOf(id), who = NPCDEF[id] ? NPCDEF[id].n : id.toUpperCase();
  if (!list.length) return false;
  for (const q of list) {
    const st = S.quests[q], Q = QUESTS[q];
    if (st && st.st === 'active' && questProg(q) >= Q.n) {
      st.st = 'done';
      for (const [k, v] of Object.entries(Q.reward.st || {})) S.st[k] += v;
      if (Q.reward.maxHp) { S.maxHp += Q.reward.maxHp; }
      S.hp = S.maxHp; S.coins += Q.reward.coins || 0;
      SFX.lvl(); saveGame();
      say([who + ': ¡Cumpliste el encargo "' + Q.title + '"! Muchas gracias.', 'Recompensa: ' + rewardText(Q.reward) + '. Tus atributos subieron para siempre.']);
      return true;
    }
  }
  if (list.some(q => S.quests[q] && S.quests[q].st === 'active')) return false;
  const next = list.find(q => !S.quests[q]);
  if (!next) return false;
  const Q = QUESTS[next];
  say([who + ': Oye, tengo un encargo para ti: "' + Q.title + '". ' + Q.desc, 'Recompensa: ' + rewardText(Q.reward) + '.'],
    [{ t:'ACEPTAR', fn:() => { S.quests[next] = { st:'active', base:questBase(next) }; SFX.ok(); toast('NUEVO ENCARGO: ' + Q.title, '#fcd84a'); saveGame(); } },
     { t:'AHORA NO', fn:() => talkTo(id, npc, true) }]);
  return true;
}
function questKill(type){
  S.kills = S.kills || {}; S.kills[type] = (S.kills[type] || 0) + 1; S.killsTotal = (S.killsTotal || 0) + 1;
  for (const q in S.quests || {}) {
    const Q = QUESTS[q], st = S.quests[q];
    if (!Q || st.st !== 'active' || (Q.type !== 'kill' && Q.type !== 'killAll')) continue;
    if (Q.type === 'kill' && !Q.target.includes(type)) continue;
    const p = questProg(q);
    if (p === Q.n) toast('ENCARGO LISTO: VUELVE A HABLAR CON ' + (NPCDEF[Q.giver] ? NPCDEF[Q.giver].n : ''), '#60e070');
    else if (p < Q.n && (Q.type === 'kill' || p % 5 === 0)) toast(Q.title + ' ' + p + '/' + Q.n, '#c8e8d8');
  }
}

const OPP_NAMES = ['TÍO PELAO','LA FEÑA','DON WACHO','EL POLLO','SEBA','LA COTE','EL FLACO','KLAUS','KIKE','LA PANCHI'];
const LOOKS = ['curly','spiky','bun','bald','cap','beanie'];
function randomLook(name){

  const pal = ['#d8402a','#3a7ae8','#48a860','#8a4ad0','#e8a028','#2a2a38','#c83a78'];
  const hair = pick(['#141014','#5a3a1c','#9a4422','#f0d070','#d8d8e0']);
  const sh = pick(pal);
  return { style:pick(LOOKS), c:{ hat:pick(pal), hatD:'#1a1020', hair, hairD:hair, skin:pick(['#f1c9a0','#e8a878','#b87a4b','#fbdcc4']), shirt:sh, shirtD:'#1a1020', pants:'#2a2a38', shoe:'#1a1020' } };
}
function startTour(deck, cfg){
  cfg = cfg || { rounds:3, diff:0, liga:false, name:'TORNEO' };
  const names = [...OPP_NAMES].sort(() => Math.random() - 0.5).slice(0, cfg.rounds);
  G.tour = { deck, cfg, room:G.roomId, round:0, wins:0, phase:'vs', t:0, buzz:S.buzz, opps:names.map(n => ({ n, deck:pick(DECKS).id, look:randomLook(n) })), ev:[], ei:0, lives:[20, 20], cur:null, pops:[] };

  prepRound();
}
function prepRound(){
  const T_ = G.tour, o = T_.opps[T_.round];
  const pw = clamp(0.5 + mu(T_.deck, o.deck) + (stats().int - 5) * 0.03 + T_.buzz * 0.02 - T_.round * 0.04 - T_.cfg.diff, 0.15, 0.88);
  T_.pwin = pw; T_.iwin = Math.random() < pw;
  T_.ev = genDuel(T_.deck, o.deck, T_.iwin); T_.ei = 0; T_.lives = [20, 20]; T_.cur = null; T_.phase = 'vs'; T_.t = 0; T_.pops = [];
}
function genDuel(myDeck, oppDeck, iWin){
  const L = [20, 20], ev = [], winner = iWin ? 0 : 1; let turn = rnd(2), guard = 0;
  while (L[0] > 0 && L[1] > 0 && guard++ < 60) {
    const deck = turn === 0 ? myDeck : oppDeck, card = pick(DECK[deck].cards), isW = turn === winner, opp = 1 - turn;
    let dmg = isW ? 3 + rnd(4) : 1 + rnd(4), heal = 0;
    if (deck === 'life' && Math.random() < 0.4) { heal = 2 + rnd(4); dmg = 0; }
    else if ((deck === 'replenish' || deck === 'langostino') && Math.random() < 0.25) dmg = 0;
    if (!isW) dmg = Math.min(dmg, L[opp] - 1);
    if (guard > 40 && isW) dmg = L[opp];
    L[opp] -= dmg; L[turn] += heal;
    ev.push({ who:turn, card, dmg, heal, lives:[L[0], L[1]] });
    turn = opp;
  }
  return ev;
}
function updateTour(){
  const T_ = G.tour; T_.t++;
  for (const p of T_.pops) p.t++;
  T_.pops = T_.pops.filter(p => p.t < 40);
  if (T_.phase === 'vs') { if (T_.t > 100 || (T_.t > 20 && pressed('a'))) { T_.phase = 'duel'; T_.t = 0; } }
  else if (T_.phase === 'duel') {
    const step = K.a ? 10 : 42;
    if (T_.t >= step) {
      T_.t = 0;
      if (T_.ei < T_.ev.length) {
        const e = T_.ev[T_.ei++]; T_.cur = e; T_.lives = e.lives;
        if (e.dmg) { T_.pops.push({ s:'-' + e.dmg, side:1 - e.who, col:'#ff6040', t:0 }); SFX.hit(); }
        if (e.heal) { T_.pops.push({ s:'+' + e.heal, side:e.who, col:'#60e070', t:0 }); SFX.heal(); }
        if (!e.dmg && !e.heal) { T_.pops.push({ s:'¡NO!', side:e.who, col:'#88c8f8', t:0 }); SFX.move(); }
      } else {
        T_.phase = 'res'; T_.t = 0;
        if (T_.iwin) { T_.wins++; SFX.win(); } else SFX.lose();
      }
    }
  } else if (T_.phase === 'res') {
    if (T_.t > 40 && pressed('a')) {
      if (T_.iwin && T_.round < T_.cfg.rounds - 1) { T_.round++; prepRound(); }
      else { T_.phase = 'end'; T_.t = 0; finishTour(); }
    }
  } else if (T_.phase === 'end') {
    if (T_.t > 40 && pressed('a')) {
      G.state = 'world'; loadRoom(T_.room || 'arena', 7 * TS + 3, 5 * TS + 4); PL.dir = 1;
      const r = T_.reward;
      say(r.lines, null, () => { if (r.card) addCard(r.card); if (r.sword) addSword(r.sword); if (r.ending) { G.state = 'ending'; G.t = 0; playMusic('town'); } });
      G.tour = null;
    }
  }
}

    if (pressed('b') || pressed('menu')) { m.deck = null; SFX.back(); }

        G.menu = null;

      } else SFX.back();

  if (pressed('menu') || pressed('b')) { G.menu = null; SFX.back(); saveGame(); return; }
  if (pressed('left')) { m.tab = (m.tab + 4) % 5; m.sel = 0; SFX.move(); }

const THEME_COL = { town:'#d8b060', forest:'#3e8a36', dirt:'#a88050', swamp:'#4a6a40', meadow:'#88c860', sand:'#e8d098' };

function drawWorldMap(){

      tiny(SHORT[id].replace('. ', '.'), px + w / 2, py + h / 2 - 2, '#1a1020', 'center');

      if (id === cur && (frame >> 4) & 1) { ctx.strokeStyle = '#fcd84a'; ctx.lineWidth = 2; ctx.strokeRect(px - 1, py - 1, w + 2, h + 2); }

/* ============ ONLINE (co-op en vivo, PeerJS) ============ */
const NET = { role:null, peer:null, conns:[], host:null, pid:null, code:null, others:{}, hostRoom:null, gotEn:0 };
let NID = 0;
const netEl = id => document.getElementById(id);
function netStatus(s){ const el = netEl('netStatus'); if (el) el.textContent = s; }
function genCode(){ const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = ''; for (let i = 0; i < 4; i++) s += a[rnd(a.length)]; return s; }
function netReady(){
  if (!window.Peer) { netStatus('No se pudo cargar el modo online (revisa tu internet).'); return false; }
  if (!S || G.state !== 'world') { netStatus('Primero entra al juego (nueva partida o continuar).'); return false; }
  return true;
}
function netLeave(silent){
  try { NET.peer && NET.peer.destroy(); } catch(_) {}
  NET.role = null; NET.peer = null; NET.conns = []; NET.host = null; NET.others = {}; NET.hostRoom = null; NET.pid = null;
  for (const e of G.enemies) e.remote = false;
  if (!silent) netStatus('Juegas solo.');
}
function netHost(){
  if (!netReady()) return;
  netLeave(true);
  const code = genCode(), peer = new Peer('pmq-' + code.toLowerCase());
  Object.assign(NET, { peer, role:'host', code, pid:'h' });
  netStatus('Creando sala...');
  peer.on('open', () => netStatus('SALA ' + code + ' · pásale este código a tus amigos.'));
  peer.on('connection', c => {
    c.on('open', () => {
      if (NET.conns.length >= 2) { c.send({ t:'full' }); setTimeout(() => c.close(), 300); return; }
      c.pid = 'p' + (++NID); NET.conns.push(c); c.send({ t:'hello', pid:c.pid });
      SFX.ok(); netStatus('SALA ' + code + ' · ' + (NET.conns.length + 1) + ' jugadores.');
    });
    c.on('data', d => hostRecv(c, d));
    c.on('close', () => {
      const o = NET.others[c.pid]; NET.conns = NET.conns.filter(x => x !== c); delete NET.others[c.pid];
      if (o) toast(o.name + ' SE FUE'); netStatus('SALA ' + code + ' · ' + (NET.conns.length + 1) + ' jugadores.');
    });
  });
  peer.on('error', e => { if (e.type === 'unavailable-id') netHost(); else netStatus('Error online: ' + e.type); });
}
function netJoin(){
  if (!netReady()) return;
  const code = (netEl('netCode').value || '').trim().toUpperCase();
  if (!/^[A-Z]{4}$/.test(code)) { netStatus('El código son 4 letras.'); return; }
  netLeave(true);
  const peer = new Peer();
  Object.assign(NET, { peer, role:'client', code });
  netStatus('Conectando a ' + code + '...');
  peer.on('open', () => {
    const c = peer.connect('pmq-' + code.toLowerCase(), { reliable:true });
    NET.host = c;
    c.on('open', () => { netStatus('Conectado a la sala ' + code + '.'); SFX.ok(); });
    c.on('data', d => clientRecv(d));
    c.on('close', () => { if (NET.role === 'client') { toast('SE CORTO LA SALA'); netLeave(true); netStatus('Se cortó la conexión. Juegas solo.'); } });
  });
  peer.on('error', e => netStatus(e.type === 'peer-unavailable' ? 'No existe la sala ' + code + '.' : 'Error online: ' + e.type));
}
function myState(){
  return { pid:NET.pid, name:CH().n, ch:S.ch, room:G.roomId, x:Math.round(PL.x), y:Math.round(PL.y), dir:PL.dir, atk:PL.atk, walk:Math.floor(PL.walk) % 2, hp:S.hp, max:S.maxHp };
}
const sendAll = m => { for (const c of NET.conns) if (c.open) c.send(m); };
function sendTo(pid, m){ if (NET.role === 'host') { const c = NET.conns.find(x => x.pid === pid); if (c && c.open) c.send(m); } }
function hostRecv(c, d){
  if (d.t === 'st') { d.pid = c.pid; const o = NET.others[c.pid]; if (!o) toast(d.name + ' SE UNIO', '#60e070'); NET.others[c.pid] = Object.assign(o || { rx:d.x, ry:d.y }, d); }
  else if (d.t === 'hit') {
    if (d.room !== G.roomId || G.state !== 'world') return;
    const e = G.enemies.find(o => o.nid === d.id && !o.dead);
    if (e) applyHit(e, d.dmg, d.kx, d.ky);
  } else if (d.t === 'gift') {
    if (d.to === 'h') receiveGift(d); else sendTo(d.to, d);
  }
}
function clientRecv(d){
  if (d.t === 'hello') NET.pid = d.pid;
  else if (d.t === 'full') { netStatus('La sala está llena (máximo 3).'); netLeave(true); }
  else if (d.t === 'pl') {
    const seen = {};
    for (const s of d.list) {
      if (s.pid === NET.pid) continue;
      seen[s.pid] = true;
      if (s.pid === 'h') NET.hostRoom = s.room;
      const o = NET.others[s.pid]; if (!o) toast(s.name + ' ESTA EN LA SALA', '#60e070');
      NET.others[s.pid] = Object.assign(o || { rx:s.x, ry:s.y }, s);
    }
    for (const k in NET.others) if (!seen[k]) delete NET.others[k];
  }
  else if (d.t === 'en') { if (G.state === 'world' && d.room === G.roomId) applyEnemySnap(d.list); }
  else if (d.t === 'kill') {
    if (G.state !== 'world' || d.room !== G.roomId) return;
    const e = G.enemies.find(o => o.nid === d.id && o.remote);
    const fake = e || spawnEnemy(d.type, d.x, d.y);
    fake.remote = true; killEnemy(fake, true);
  }
  else if (d.t === 'gift') receiveGift(d);
}
function receiveGift(d){ if (!S || !CARDS[d.card]) return; toast('REGALO DE ' + d.from + '!', '#fcd84a'); addCard(d.card); }
function sendGift(to, card){
  if ((S.cards[card] || 0) < 1) return;
  S.cards[card]--; saveGame();
  const m = { t:'gift', to, card, from:CH().n };
  if (NET.role === 'host') sendTo(to, m); else if (NET.host) NET.host.send(m);
  toast('REGALASTE ' + CARDS[card].n, '#c8d8e8'); SFX.ok();
}
const clientSynced = () => NET.role === 'client' && NET.hostRoom === G.roomId && frame - NET.gotEn < 60;
function applyEnemySnap(list){
  NET.gotEn = frame;
  const seen = new Set();
  for (const [id, type, x, y, hp, max, flip, fl] of list) {
    seen.add(id);
    let e = G.enemies.find(o => o.remote && o.nid === id);
    if (!e) { e = spawnEnemy(type, x - 2, y - 2); e.nid = id; e.remote = true; e.x = x; e.y = y; }
    e.tx = x; e.ty = y; e.hp = hp; e.max = max; e.flip = !!flip; if (fl && e.flash <= 0) e.flash = 6;
  }
  G.enemies = G.enemies.filter(e => e.remote && seen.has(e.nid));
  const boss = G.enemies.find(e => MON[e.type].boss); G.bossBar = boss || null;
}
function applyHit(e, dmg, kx, ky){
  e.hp -= dmg; e.flash = 10; e.kb = 8; e.kx = kx; e.ky = ky;
  if (e.hp <= 0) killEnemy(e);
}
function netTick(){
  if (!NET.role || !S || G.state === 'title' || G.state === 'select') return;
  for (const k in NET.others) { const o = NET.others[k]; o.rx += (o.x - o.rx) * 0.35; o.ry += (o.y - o.ry) * 0.35; }
  if (frame % 4) return;
  if (NET.role === 'host') {
    if (!NET.conns.length) return;
    const list = [myState()].concat(Object.values(NET.others).map(o => ({ pid:o.pid, name:o.name, ch:o.ch, room:o.room, x:o.x, y:o.y, dir:o.dir, atk:o.atk, walk:o.walk, hp:o.hp, max:o.max })));
    sendAll({ t:'pl', list });
    if (G.state === 'world') sendAll({ t:'en', room:G.roomId, list:G.enemies.filter(e => !e.dead).map(e => [e.nid, e.type, Math.round(e.x), Math.round(e.y), e.hp, e.max, e.flip ? 1 : 0, e.flash > 0 ? 1 : 0]) });
  } else if (NET.host && NET.host.open) {
    NET.host.send(Object.assign({ t:'st' }, myState()));
  }
}
const othersHere = () => Object.values(NET.others).filter(o => o.room === G.roomId);
netEl('btnTitle').addEventListener('click', () => { audioInit(); if (G.state !== 'title') goToTitle(); cvs.focus(); });
netEl('netHost').addEventListener('click', () => { audioInit(); netHost(); });
netEl('netJoin').addEventListener('click', () => { audioInit(); netJoin(); });
netEl('netLeave').addEventListener('click', () => { if (NET.role) toast('SALISTE DE LA SALA'); netLeave(); });
netEl('netCode').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') netJoin(); });

/* ============ MAIN LOOP ============ */
function step(){
  readInput(); frame++; G.t++;
  if (G.state === 'title') updateTitle();
  else if (G.state === 'select') updateSelect();
  else if (G.state === 'slots') updateSlots();
  else if (G.state === 'tour') updateTour();
  else if (G.state === 'arcade') updateArcade();
  else if (G.state === 'ending') { if (G.t > 200 && pressed('a')) { G.state = 'world'; playMusic(G.def.music); } }
  else if (G.state === 'world') {
    if (G.fade > 0) G.fade--;
    if (G.cardGet) { G.cardGet.t++; if (G.cardGet.t > 30 && (pressed('a') || pressed('b'))) { const done = G.cardGet.done; G.cardGet = G.cardQueue.shift() || null; if (G.cardGet) SFX.card(); else SFX.ok(); if (done) toast('¡MAZO ' + done + ' COMPLETO!', '#fcd84a'); } }
    else if (G.dialog) updateDialog();
    else if (G.menu) updateMenu();
    else if (G.dead) {
      G.dead++;
      if (G.dead > 150) {
        G.dead = 0; S.hp = S.maxHp; S.coins = Math.floor(S.coins / 2); PL.inv = 60;
        loadRoom('pueblo', 7 * TS + 3, 6 * TS + 6);
        say(['Despertaste en el pueblo. Perdiste la mitad de tus monedas.']);
      }
    }
    else updateWorld();
    if ((G.cardGet || G.dialog || G.menu) && NET.role === 'host' && NET.conns.length) { updateEnemies(); updateParts(); }
    for (const t of G.toasts) if (G.dialog || G.menu) t.t = Math.min(t.t, 140);
  }
  if ((G.state === 'title' || G.state === 'slots' || G.state === 'select') && AC && musicName !== 'title') playMusic('title');
  netTick();
  tickMusic();
}
function drawBestiary(){
  R(0, 0, W, H, '#5cae44');
  txt('BESTIARIO', 120, 3, '#fcd84a', 'center', '#000');
  const small = ['gob','pup','ball','carno','shade','specter','warden','merfolk'];
  small.forEach((k, i) => {
    const x = 6 + (i % 4) * 58, y = 20 + Math.floor(i / 4) * 44;
    ctx.save(); ctx.translate(x + 13, y + 6); ctx.scale(2, 2); drawMon(k, 0, 0, frame, false); ctx.restore();
    tiny(MON[k].n, x + 29, y, '#fff', 'center');
  });
  [['negator',6],['angel',64],['siege',124],['dread',184]].forEach(([k, x]) => {
    const sz = MON[k].size, s = sz === 24 ? 1.5 : 1;
    ctx.save(); ctx.translate(x + 26 - sz * s / 2, 118); ctx.scale(s, s); drawMon(k, 0, 0, frame, false); ctx.restore();
    tiny(MON[k].n.split(' ').pop(), x + 26, 111, '#fff', 'center');
  });
}
function drawZonesPreview(){
  if (!S) S = newSave(0);
  const ids = ['tolaria','valpo','bosqueProf','pantanoProf','D:minas:1','D:torre:4'];
  R(0, 0, W, H, '#000');
  ids.forEach((id, i) => {
    G.roomId = id; G.def = getDef(id); G.map = G.def.map.map(r => r.split('')); buildCache();
    const x = (i % 3) * 80, y = Math.floor(i / 3) * 80;
    ctx.drawImage(cache, x, y, 80, 53); tiny(SHORT[id] || id, x + 40, y + 56, '#fff', 'center');
  });
}
function render(){
  if (location.hash === '#bestiario') { drawBestiary(); return; }
  if (location.hash === '#zonas') { if (!G.zonesDone) { drawZonesPreview(); G.zonesDone = true; } return; }
  if (G.state === 'title') drawTitle();
  else if (G.state === 'select') drawSelect();
  else if (G.state === 'slots') drawSlots();
  else if (G.state === 'tour') drawTour();
  else if (G.state === 'arcade') drawArcade();
  else if (G.state === 'ending') drawEnding();
  else if (G.state === 'world') {
    if (G.menu) drawMenu();
    else {
      drawWorld();
      if (G.dead) { ctx.fillStyle = `rgba(90,0,0,${Math.min(0.75, G.dead / 60)})`; ctx.fillRect(0, 0, W, H); if (G.dead > 40) txt('TE DESMAYASTE...', 120, 72, '#fff', 'center', '#000'); }
      if (G.cardGet) drawCardGet();
      if (G.dialog) drawDialog();
    }
    if (G.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${G.fade / 14})`; ctx.fillRect(0, 0, W, H); }
  }
}
let last = performance.now(), acc = 0;
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  render();
  requestAnimationFrame(loop);
}
cvs.addEventListener('pointerdown', () => { audioInit(); cvs.focus(); });
addEventListener('pagehide', saveGame);
const go = () => requestAnimationFrame(loop);
if (document.fonts && document.fonts.load) document.fonts.load('8px "Press Start 2P"').then(() => { G.cacheDirty = true; go(); }, go); else go();
})();
</script>
